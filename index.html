      <div class="kpi ${nRet?'neg':''}"><span>À facturer</span><b>${nRet}</b><small>démontage + ${CL_FACT_J} j dépassé</small></div>
      <div class="kpi"><span>Rendues ce mois</span><b>${rendM}</b></div></div>
    <div class="bar chf"><input class="search" type="search" placeholder="Rechercher (société, personne, n°, local…)" value="${esc(st.q)}" oninput="UI.cl.q=this.value;pgRefresh()">
      <label class="chk">Trier <select class="sel" onchange="UI.cl.tri=this.value;lsSet('equipe.cltri',this.value);render()">${[['fact','À facturer d\'abord'],['recent','Remise : plus récentes'],['ancien','Remise : plus anciennes'],['fin','Fin de démontage (la plus proche)'],['soc','Société A → Z']].map(([k,l])=>`<option value="${k}" ${st.tri===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <div class="bar chf"><select class="sel" onchange="UI.cl.fs=this.value;render()"><option value="">Toutes les sociétés / salons</option>${socs.map(x=>`<option ${x===st.fs?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select class="sel" onchange="UI.cl.fp=this.value;render()"><option value="">Remises par : tous</option>${pars.map(x=>`<option ${x===st.fp?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select class="sel" onchange="UI.cl.fe=this.value;render()">${[['','Tous les états'],['fact','💶 À facturer'],['bientot','Facturables plus tard'],['sans','Sans fin de démontage'],['ras','RAS (pas de facturation)']].map(([k,l])=>`<option value="${k}" ${st.fe===k?'selected':''}>${l}</option>`).join('')}</select>
      ${nf||q?`<button class="btn sm" onclick="Object.assign(UI.cl,{q:'',fs:'',fp:'',fe:''});render()">✕ Effacer les filtres</button><span class="hint" style="margin:0">${G.length} remise${G.length>1?'s':''} sur ${Gall.length}</span>`:''}</div>
    ${G.map(clCarte).join('')||`<p class="empty">${q||nf?'Aucun résultat.':'Aucune clef dehors 👍'}</p>`}

    for(const p of L){const n=Math.max(0,Math.min(clDehors(p),parseInt($(`.clr[data-id="${p.id}"]`).value,10)||0)),s=$(`.cls[data-id="${p.id}"]`).value;
      if(!n&&!s)continue;const r=(+p.rendu||0)+n;

    catch(e){$('#ferr').textContent=e.message;b.disabled=false;b.textContent='Enregistrer'}
  };

/* ----- import d'un formulaire Excel de demande de clefs (glisser-déposer, fichier ou copier-coller) ----- */
// glisser-déposer n'importe où dans la page : sur l'onglet Clefs ou fenêtre de remise ouverte
(()=>{let n=0;const zone=()=>$('#clxf')||$('#clview'),isF=e=>[...(e.dataTransfer&&e.dataTransfer.types||[])].some(t=>t==='Files'||t==='application/x-moz-file');
  const ban=on=>{let b=$('#cldropban');if(on&&!b){b=document.createElement('div');b.id='cldropban';b.innerHTML='<div>📥 Dépose le formulaire Excel de demande de clefs</div>';document.body.appendChild(b)}if(!on&&b)b.remove()};
  window.addEventListener('dragenter',e=>{if(!isF(e))return;n++;if(zone())ban(1)});
  window.addEventListener('dragleave',e=>{if(!isF(e))return;if(--n<=0){n=0;ban(0)}});
  window.addEventListener('dragover',e=>{if(!isF(e))return;e.preventDefault();e.dataTransfer.dropEffect=zone()?'copy':'none'});
  window.addEventListener('drop',e=>{if(!isF(e)&&!(e.dataTransfer&&e.dataTransfer.files.length))return;e.preventDefault();n=0;ban(0); // jamais d'ouverture du fichier par le navigateur
    const f=e.dataTransfer.files[0];if(!f||!zone())return;if(!/\.(xlsx|xlsm|xls|csv)$/i.test(f.name))return toast('Dépose un fichier Excel (.xlsx)',1);
    if(!$('#clxf'))clNew();clXFile(f)});
})();
const clXN=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
const clXV=v=>v==null?'':typeof v==='number'?String(Math.round(v*1000)/1000):String(v).replace(/\s+/g,' ').trim();
function clXDate(v){
  if(v instanceof Date)return v.getFullYear()>=2000?ymd(new Date(v.getTime()+12*3600e3)):'';
  const m=String(v??'').trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=+m[3]<100?2000+(+m[3]):+m[3];return y>=2000?y+'-'+pad(+m[2])+'-'+pad(+m[1]):''}
  return /^\d{4}-\d{2}-\d{2}/.test(String(v||''))?String(v).slice(0,10):''}
// lignes (tableau de tableaux) → remises regroupées par société + personne
function clXRows(rows){
  const COLS=[['prenom',/PRENOM/],['qte',/NOMBRE|QTE|QUANTITE|^NB\b/],['nom',/(^|\s)NOM\b/],['numero',/^N°|^NO\b|^N\s?CLE|NUMERO/],
    ['designation',/DESIGNATION|LOCAL|ESPACE/],['fin',/FIN.*(SALON|DEMONT|EVEN)/],['societe',/SOCIETE|SALON|ENTREPRISE/]];
  let hi=-1,map={};const top={};
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i]||[],m={};
    r.forEach((c,j)=>{const t=clXN(c);if(!t)return;const k=(COLS.find(([k,re])=>re.test(t)&&!(k in m))||[])[0];if(k)m[k]=j});
    if('numero' in m&&('designation' in m||'qte' in m)){hi=i;map=m;break}
    // en-tête du formulaire : « SALON / EVENEMENT », « COORDINATEUR » suivis de leur valeur

      let jd=cells.findIndex(c=>byD[clXN(c)]);if(jd<0)jd=cells.findIndex((c,j)=>j!==jn&&/ - /.test(c));

    lines.push({societe:soc||top.societe||'',prenom:pre,nom,fin,l:c?{clefId:c.id,numero:c.numero,designation:clDes(c),qte:String(qte>0?qte:1),rendu:'0'}
      :{clefId:'',numero,designation:des,qte:String(qte>0?qte:1),rendu:'0',libre:1,xko:1}})});
  if(top.personne&&!lines.some(x=>x.prenom||x.nom)){const w=top.personne.split(' '),k=w.findIndex(x=>x.length>1&&x===x.toUpperCase()&&/[A-Z]/.test(x));
    lines.forEach(x=>{x.prenom=k>0?w.slice(0,k).join(' '):k<0?top.personne:'';x.nom=k>=0?w.slice(k).join(' '):''})}

// « ORGA EPOQU'AUTO » → « EPOQU'AUTO » si cette société existe déjà dans les remises

async function clXFile(f){

      res=clXRows(t.replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,''))))}
    else{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});

        .filter(x=>x.r.groups.length).sort((a,b)=>(b.r.qteCol-a.r.qteCol)||(b.r.groups.some(g=>g.prenom||g.nom)-a.r.groups.some(g=>g.prenom||g.nom))||(a.i-b.i));

function demoHandle(a,p){
  if(a==='all'){const T=DB.Taches.filter(t=>t.prive!=='oui'||t.creePar===p.user),ids=new Set(T.map(t=>t.id));return {...DB,Taches:T,Commentaires:DB.Commentaires.filter(c=>ids.has(c.tacheId))}}
  if(a==='partFaite'){const cur=DB.Taches.find(x=>x.id===p.id);if(!cur)throw new Error('Tâche introuvable');if(!asg(cur).includes(p.user))throw new Error(p.user+" n'est pas attribué à cette tâche");
    const f=fait(cur).filter(n=>n!==p.user);if(p.fait)f.push(p.user);return demoHandle('save',{sheet:'Taches',user:p.user,part:1,item:{...cur,faitPar:f.join(', ')}})}
  if(a==='lu'){const cur=DB.Memos.find(x=>x.id===p.id);if(!cur)throw new Error('Mémo introuvable');const l=String(cur.luPar||'').split(',').map(x=>x.trim()).filter(n=>n&&n!==p.user);if(p.lu)l.push(p.user);cur.luPar=l.join(', ');return cur}
  if(a==='importDrapeaux'){if(DB.Drapeaux.length)throw new Error("L'inventaire contient déjà des drapeaux : reprise refusée");DB.Drapeaux=p.items.map((x,i)=>({...x,id:Math.random().toString(36).slice(2,10),ordre:String(i+1)}));return {lignes:DB.Drapeaux.length}}
  if(a==='importBudget'){const id=()=>Math.random().toString(36).slice(2,10);p.data.lignes.forEach(l=>{const o={...l,id:id()};delete o.mvts;DB.BudgetLignes.push(o);(l.mvts||[]).forEach(m=>DB.BudgetMvts.push({...m,id:id(),ligneId:o.id,montant:String(m.montant)}))});(p.data.inventaire||[]).forEach(x=>DB.Inventaire.push({...x,id:id()}));(p.data.sap||[]).forEach(x=>DB.SAP.push({...x,id:id()}));return {ok:1}}
  if(a==='importClefs'){if(DB.Clefs.length||DB.ClefsPrets.length)throw new Error('Les clefs sont déjà reprises : reprise refusée');DB.Clefs=p.data.clefs.map(x=>({...x}));DB.ClefsPrets=p.data.prets.map(x=>({...x,datePrepa:x.datePrepa||x.renduLe||'2025-01-01'}));return {clefs:DB.Clefs.length,prets:DB.ClefsPrets.length}}
  if(a==='saveClefsLot')return p.items.map(it=>{const o={...it};if(+o.rendu>0&&!o.renduLe)o.renduLe=today();if(+o.rendu>=+o.qte)o.statut='';if(!o.lot)o.lot=o.id;return demoHandle('save',{sheet:'ClefsPrets',user:p.user,item:o})});
  if(!DB.Projets){DB.Projets=[];DB.ProjetMvts=[]}
  if(a==='save'&&(p.sheet==='Projets'||p.sheet==='ProjetMvts')&&!p.item.id)p.item.proprio=p.user;
  const L=DB[p.sheet]; if(!L) throw new Error('Onglet inconnu');
  if(a==='save'){
    const cur=p.item.id?L.find(x=>x.id===p.item.id):null; const o={...(cur||{}),...p.item}; const now=nowISO();
    if(p.sheet==='Nacelle'){if(o.fin<=o.debut)throw new Error('La fin doit être après le début');const c=L.find(b=>b.id!==o.id&&o.debut<b.fin&&b.debut<o.fin);if(c)throw new Error(`Nacelle déjà réservée par ${c.nom} du ${fDT(c.debut)} au ${fDT(c.fin)}`)}
    if(!cur){o.id=Math.random().toString(36).slice(2,10);if(p.sheet==='Taches'){o.creePar=p.user;o.creeLe=now}if(p.sheet==='Commentaires')o.date=now;if(p.sheet==='Memos'){o.creePar=p.user;o.creeLe=now;o.statut=o.statut||'Actif'}}
    if(p.sheet==='Memos'){if(!cur||['titre','texte','decisions','niveau'].some(k=>(cur[k]||'')!==(o[k]||'')))o.luPar=p.user;o.majLe=now}
    if(p.sheet==='Taches'){if(cur&&cur.prive==='oui')o.prive='oui';if(o.prive==='oui')o.assigne=o.creePar;if(!p.part)o.faitPar=cur?cur.faitPar||'':'';demoParts(o,cur,p.part);o.majLe=now} if(p.sheet!=='Equipe'&&p.sheet!=='Commentaires')o.majPar=p.user;
    if(cur)Object.assign(cur,o);else L.push(o); return o;
  }
  if(a==='delete'){DB[p.sheet]=L.filter(x=>x.id!==p.id);if(p.sheet==='Taches')DB.Commentaires=DB.Commentaires.filter(c=>c.tacheId!==p.id);if(p.sheet==='BudgetLignes')DB.BudgetMvts=DB.BudgetMvts.filter(m=>m.ligneId!==p.id);if(p.sheet==='Projets')DB.ProjetMvts=DB.ProjetMvts.filter(m=>m.projetId!==p.id);return {id:p.id}}
}

  FB.onAuth(st=>{
    if(st.etat==='ok'){
      const ch=me!==st.nom; me=st.nom; render();
      if($('.ov.fbauth'))closeModal(true);
      if(ch){loaded=false;$('#view').innerHTML='<div class="loading">Chargement…</div>';

    }

    <div class="err" id="aerr"></div>
    <div class="acts"><button class="btn" onclick="fbOubli()">Mot de passe oublié</button><span class="sp"></span>
      <button class="btn" id="asu" onclick="fbSignup()">Première connexion</button><button class="btn pri" id="ali" onclick="fbLogin()">Se connecter</button></div>
    <p class="hint">Première fois ? Saisis ton adresse (celle donnée au responsable), choisis un mot de passe et touche « Première connexion ». Tu restes connecté sur ce téléphone.</p>`);
  if(!em)$('#aem').focus();
}
const aErr=m=>{const e=$('#aerr');if(e)e.textContent=m||''};
const aVals=()=>{const e=$('#aem').value.trim(),p=$('#apw').value;lsSet('equipe.email',e);return [e,p]};
async function fbLogin(){const [e,p]=aVals();if(!e||!p)return aErr('Adresse et mot de passe obligatoires');const done=setBusy($('#ali'),'Connexion…');
  try{await FB.login(e,p)}catch(x){done();aErr(x.message)}}
async function fbSignup(){const [e,p]=aVals();if(!e)return aErr('Saisis ton adresse e-mail');if(p.length<6)return aErr('Choisis un mot de passe d\'au moins 6 caractères');
  const done=setBusy($('#asu'),'Création…');try{await FB.signup(e,p)}catch(x){done();aErr(x.message)}}
async function fbOubli(){const e=$('#aem').value.trim();if(!e)return aErr('Saisis d\'abord ton adresse e-mail');
  try{await FB.resetPw(e);aErr('');toast('Mail envoyé à '+e+' pour choisir un nouveau mot de passe')}catch(x){aErr(x.message)}}
async function fbRenvoyer(){const done=setBusy($('#arv'),'Envoi…');try{await FB.resendVerif();toast('Mail renvoyé ✓')}catch(x){aErr(x.message)}done()}
function fbCompte(){const w=FB?FB.whoami():{};
  modal(`<h2>Mon compte</h2><p>${pill(me)}</p><p class="hint">Connecté avec <b>${esc(w.email||'')}</b>${w.role?' · '+esc(w.role):''}.</p>
    <div class="acts"><button class="btn" onclick="fbOubli2()">Changer de mot de passe</button><span class="sp"></span><button class="btn" onclick="closeModal()">Fermer</button><button class="btn danger" onclick="closeModal(true);FB.logout()">Se déconnecter</button></div>`)}
async function fbOubli2(){try{await FB.resetPw(FB.whoami().email);toast('Mail envoyé pour choisir un nouveau mot de passe')}catch(x){toast(x.message,1)}}
// Reprise du Google Sheet : une seule fois, par le propriétaire
async function fbReprise(st){
  fbModal(`<h2>Mise en route</h2><p class="hint">Vérification…</p>`);
  try{
    const dr=await FB.dejaRepris();
    if(dr===null) return fbSansAcces(st); // pas propriétaire : l'accès doit être ouvert par un responsable
    if(dr) return fbModal(`<h2>Bienvenue</h2><p>Les données sont déjà dans Firebase, mais ton adresse <b>${esc(st.email)}</b> n'est liée à aucun membre de l'équipe.</p>
      <p class="hint">Un responsable peut la saisir à côté de ton nom dans 👥 Équipe.</p><div class="acts"><span class="sp"></span><button class="btn" onclick="FB.logout()">Se déconnecter</button></div>`);
    const L=await FB.repriseMembres();
    fbModal(`<h2>Reprise des données du Google Sheet</h2>
      <p>Tu es le propriétaire : cette étape copie toutes les données de l'appli actuelle (tâches, nacelle, régie, drapeaux, budget, travaux…) dans Firebase. Le Google Sheet n'est pas modifié.</p>
      <label class="fl full"><span>Qui es-tu dans l'équipe ?</span><select id="rnom" class="sel">${L.map(e=>`<option>${esc(e.nom)}</option>`).join('')}</select></label>
      <div class="err" id="aerr"></div>
      <div class="acts"><button class="btn" onclick="FB.logout()">Se déconnecter</button><span class="sp"></span><button class="btn pri" id="rgo" onclick="fbRepriseGo()">Reprendre les données</button></div>
      <p class="hint" id="rprog"></p>`);
  }catch(e){fbModal(`<h2>Mise en route</h2><p class="negt">${esc(e.message)}</p><div class="acts"><span class="sp"></span><button class="btn" onclick="FB.logout()">Se déconnecter</button><button class="btn pri" onclick="location.reload()">Réessayer</button></div>`)}
}
async function fbRepriseGo(){
  const nom=$('#rnom').value;const done=setBusy($('#rgo'),'Reprise en cours…');
  try{const r=await FB.reprise(nom,m=>{const p=$('#rprog');if(p)p.textContent=m});
    toast(r.elements+' éléments repris ✓');
    if(r.sansEmail.length)setTimeout(()=>toast('Sans adresse e-mail (ne peuvent pas encore se connecter) : '+r.sansEmail.join(', '),1),2500);
  }catch(e){done();aErr(e.message)}
}

else {
  render(); loadAll(); dtLoad();
  setInterval(()=>{if(!document.hidden&&!$('.ov'))loadAll(true)},CONFIG.refreshSec*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('.ov'))loadAll(true)});
}
