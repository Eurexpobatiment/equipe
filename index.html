<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@300,400,500,600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png?v=2">
<title>Équipe Bâtiment · Eurexpo</title>
<style>
:root{--navy:#14213d;--navy2:#22335a;--accent:#e63946;--bg:#f3f4f7;--card:#fff;--line:#e2e5ec;--muted:#6b7280;--txt:#1f2937;
--ok:#2a9d5c;--warn:#e09a2b;--blue:#3a6ea5;--grey:#9aa3b2;--red:#c0392b}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.08)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}
header img{height:34px;max-width:45vw;object-fit:contain;background:#fff;border-radius:6px;padding:3px 6px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:11px;font-weight:400;opacity:.7}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grey);flex:none}
.dot.ok{background:#4ade80}.dot.ko{background:var(--accent)}
/* Navigation : barre latérale classée par thème (ordinateur), barre rapide + menu (téléphone) */
:root{--navw:236px;--hdrh:56px;--bnh:0px}
#tabs{position:fixed;top:var(--hdrh);left:0;bottom:0;width:var(--navw);background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 24px;z-index:19}
.ng{margin-bottom:6px}
.ngt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9aa3b2;padding:10px 10px 4px}
#tabs button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;margin:1px 0;border-radius:8px;color:#374151;cursor:pointer;text-align:left;font-size:14.5px;position:relative}
#tabs button:hover{background:#f3f4f7}
#tabs button.on{background:#fdecee;color:var(--navy);font-weight:600}
#tabs button.on::before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
#tabs .ni{width:22px;text-align:center;flex:none}
#tabs .nl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
.navbg{display:none}
#bnav{display:none}
.top0{margin-left:var(--navw)}
main{margin-left:var(--navw)!important;max-width:none!important;padding:20px 24px 80px!important}
main>*{max-width:1300px}
.appWrap{left:var(--navw)!important}
.menuBtn{display:inline-block;margin-right:2px}
/* Menu rabattu (ordinateur) : seulement les icônes, le nom apparaît au survol */
@media(min-width:900px){
  body.navmini{--navw:64px}
  #tabs{transition:width .18s ease}
  body.navmini #tabs{padding:10px 8px 24px;overflow-x:hidden}
  body.navmini #tabs .nl,body.navmini #tabs .ngt{display:none}
  body.navmini #tabs .ng{border-top:1px solid var(--line);padding-top:6px}
  body.navmini #tabs .ng:first-child{border-top:0;padding-top:0}
  body.navmini #tabs button{justify-content:center;padding:9px 0}
  body.navmini #tabs button.on::before{left:-8px}
  body.navmini #tabs .ni{font-size:18px}
  body.navmini #tabs .badge{position:absolute;top:2px;right:4px;min-width:16px;line-height:16px;font-size:10px;padding:0 4px}
}
@media(max-width:899px){
  :root{--navw:0px;--bnh:62px}
  #tabs{width:280px;max-width:85vw;top:0;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.18);padding-top:max(14px,env(safe-area-inset-top))}
  body.navo #tabs{transform:none}
  body.navo .navbg{display:block;position:fixed;inset:0;background:rgba(20,33,61,.35);z-index:39}
  main{padding:14px 12px calc(var(--bnh) + 30px)!important}
  .appWrap{bottom:var(--bnh)!important}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  #bnav button{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;min-width:0}
  #bnav .ni{font-size:20px;line-height:24px;position:relative}
  #bnav .ni .badge{position:absolute;top:-4px;right:-14px;font-size:10px;line-height:16px;min-width:16px}
  #bnav small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #bnav button.on{color:var(--navy);font-weight:600}
  #bnav button.on .ni::after{content:'';position:absolute;left:50%;bottom:-3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--accent)}
}
.demo{background:#fff4d6;color:#7a5a00;font-size:13px;padding:6px 16px;text-align:center}
main{max-width:1240px;margin:0 auto;padding:14px 14px 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar h2{margin:0;font-size:18px;flex:1;min-width:180px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c5cad6}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.danger{color:var(--red);border-color:#f0c9c4}
.btn.danger.arm{background:var(--red);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.big{padding:12px 16px;font-size:16px;text-align:left}
.btn[disabled]{opacity:.55;cursor:wait}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg-ctl button{border:0;background:none;padding:7px 12px;cursor:pointer}
.seg-ctl button.on{background:var(--navy);color:#fff}
.seg-ctl .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:600}
select.sel,input.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
input.search{min-width:0;flex:1 1 160px;max-width:280px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 12px}
.link{border:0;background:none;color:var(--blue);cursor:pointer;padding:6px 0;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 8px 2px 3px;border-radius:12px;background:#eef1f6}
.pill i{width:18px;height:18px;border-radius:50%;color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.pill.ghost{padding:2px 8px;color:var(--muted);background:none;border:1px dashed #cdd2dc}

/* Tâches */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:#e9ecf2;border-radius:12px;padding:10px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.03em;color:#475569}
.col h3 .n{background:#fff;border-radius:10px;padding:0 7px;font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid #cbd2dd;position:relative}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card.p0{border-left-color:#cbd2dd}.card.p1{border-left-color:var(--blue)}.card.p2{border-left-color:var(--warn)}.card.p3{border-left-color:var(--accent)}
.card.done{opacity:.72}
.ct{font-weight:600;margin-bottom:3px;padding-right:4px}
.card.done .ct{text-decoration:line-through;text-decoration-color:#9aa3b2}
.cd{font-size:13px;color:var(--muted);margin-bottom:6px;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.late{color:var(--accent);font-weight:600}
.tag-u{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:1px 5px}
.adv{margin-top:8px;border:1px solid var(--line);background:#f8f9fb;border-radius:7px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.adv:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.adv.ok{margin-left:6px;border-color:#2a9d5c;color:#1f7a47;background:#eefaf3}.adv.ok:hover{background:#2a9d5c;color:#fff}
.adv.undo{margin-left:6px;color:var(--muted)}
.pill.fini{background:#dcf3e5;color:#1f7a47;font-weight:600}
.parts{font-size:12px;color:var(--muted)}
.memo{white-space:pre-wrap;line-height:1.45}
.card.mv-Info{border-left-color:var(--blue)}.card.mv-Important{border-left-color:var(--warn)}.card.mv-Critique{border-left-color:var(--accent);background:#fff7f7}
.mlev{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.mgrid .card{margin-bottom:0}
.svsal{border-left-width:5px;cursor:default}
.svph{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.svdates{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:6px 0}
.svdates b{font-weight:600;color:#555}
.svwarn{font-size:13px;background:#fff6e5;border-radius:7px;padding:5px 8px;margin-top:6px}
.svbul{font-size:13px;background:#fdecee;border-radius:7px;padding:5px 8px;margin-top:6px}
.mnew{outline:2px solid var(--warn);outline-offset:-2px}
.lu{color:#1f7a47}.nonlu{color:var(--accent);font-weight:600}
.mbody{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;max-height:55vh;overflow:auto}
.mbody h3{font-size:14px;margin:12px 0 4px}.mbody h3:first-child{margin-top:0}
.tparts{margin-top:14px}.tparts h3{font-size:14px;margin:0 0 6px}.tparts .adv{margin-top:0}

/* Nacelle */
.days{display:flex;flex-direction:column;gap:10px}
.day{background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.day.today{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.day.past{opacity:.6}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dh b{flex:1;text-transform:capitalize}
.tl{position:relative;height:30px;background:repeating-linear-gradient(90deg,#f1f3f7 0,#f1f3f7 calc(12.5% - 1px),#e2e5ec calc(12.5% - 1px),#e2e5ec 12.5%);border-radius:6px;margin-bottom:16px}
.tl .tk{position:absolute;top:31px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.tl .seg{position:absolute;top:3px;bottom:3px;border-radius:5px;color:#fff;font-size:11.5px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:24px;cursor:pointer;min-width:6px}
.tl .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.bk{display:flex;gap:10px;align-items:baseline;padding:6px 4px;border-top:1px solid #f0f2f5;cursor:pointer;font-size:14px}
.bk:hover{background:#f8f9fb}
.bk .h{font-weight:600;min-width:98px;font-variant-numeric:tabular-nums}
.bk .m{color:var(--muted);font-size:13px}
.free{font-size:13px;color:var(--ok)}
.mine{background:#eef4ff;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}

/* Régisseurs */
.gridwrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid var(--line)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid #f0f2f5;text-align:center;padding:0}
.grid thead th{padding:6px 2px;font-weight:600;color:#475569;background:#fafbfc;font-size:12px;line-height:1.2}
.grid thead th.we,.grid td.we{background:#f6f7fa}
.grid thead th.td{background:var(--navy);color:#fff}
.grid th.name{text-align:left;padding:8px 10px;position:sticky;left:0;background:#fff;z-index:1;min-width:120px;font-weight:600;white-space:nowrap}
.grid td.c{height:40px;cursor:pointer;min-width:44px}
.grid td.c:hover{outline:2px solid var(--navy);outline-offset:-2px}
.grid td.c span{display:block;margin:3px;border-radius:5px;color:#fff;font-size:11px;font-weight:600;line-height:34px;overflow:hidden;white-space:nowrap}
.grid tfoot td{font-size:12px;color:var(--muted);padding:6px 0;background:#fafbfc}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* Vue mois (calendrier) */
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcal .mh{padding:6px 4px;text-align:center;font-size:12px;font-weight:600;color:#475569;background:#fafbfc;border-bottom:1px solid var(--line);text-transform:capitalize}
.mcal .mc{min-height:92px;border-right:1px solid #f0f2f5;border-bottom:1px solid #f0f2f5;padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcal .mc:nth-child(7n){border-right:0}
.mcal .mc:hover{background:#f8f9fb}
.mcal .mc.we{background:#f9fafb}
.mcal .mc.out{opacity:.4}
.mcal .mc.past .ev{opacity:.7}
.mcal .mc .dn{font-size:12px;font-weight:600;color:#475569;padding:1px 3px;align-self:flex-start;border-radius:10px}
.mcal .mc.today .dn{background:var(--navy);color:#fff;padding:1px 7px}
.mcal .ev{display:block;font-size:11px;line-height:17px;border-radius:4px;color:#fff;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mcal .more{font-size:11px;color:var(--muted);padding:0 3px}
.grid.month td.c{min-width:30px}.grid.month td.c span{font-size:10px;margin:2px;line-height:30px}
.grid.month thead th{font-size:11px}
@media (max-width:820px){.mcal .mc{min-height:64px;padding:2px}.mcal .ev{font-size:9.5px;line-height:15px;padding:0 2px}.mcal .mh{font-size:11px}}

/* Agenda (cloisons, EDL) */
.ag-day{margin-bottom:14px}
.ag-day h3{font-size:13px;text-transform:capitalize;color:#475569;margin:0 0 6px 2px}
.ag-day.today h3{color:var(--accent)}
.it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:12px;align-items:center;margin-bottom:6px;cursor:pointer}
.it:hover{border-color:#c5cad6}
.it .hr{font-weight:600;min-width:46px;font-variant-numeric:tabular-nums;color:var(--navy)}
.it .bd{flex:1;min-width:0}
.it .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.st{border:0;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap}

/* Modale */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto;z-index:50}
.mod{background:#fff;border-radius:14px;width:100%;max-width:540px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.mod h2{margin:0 0 14px;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#475569}
.fl.full{grid-column:1/-1}
.fl input,.fl select,.fl textarea,.cadd input,.cadd textarea,.cadd select{border:1px solid #d5d9e2;border-radius:8px;padding:9px 10px;background:#fff;width:100%;color:var(--txt);font-size:15px}
.fl textarea{resize:vertical}
.err{color:var(--red);font-size:14px;min-height:18px;margin:8px 0 2px}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.coms{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.coms h3{font-size:14px;margin:0 0 8px}
.com{background:#f6f7fa;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.com .ch{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.com .tx{white-space:pre-wrap;word-break:break-word}
.com .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer}
.cadd{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.made{font-size:12px;color:var(--muted);margin-top:10px}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
table.eq{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:14px}
table.eq td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.eq tr.off td:first-child{color:var(--muted);text-decoration:line-through}
table.eq select{border:1px solid #d5d9e2;border-radius:6px;padding:5px}
.eqadd{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
.eqadd input{flex:1 1 200px;border:1px solid #d5d9e2;border-radius:8px;padding:9px 10px;font-size:15px}
.eqh{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:#475569;margin:18px 2px 8px;display:flex;gap:6px;align-items:center}
.eqh .n{background:#fff;border-radius:10px;padding:0 7px;font-size:12px;color:var(--muted)}
.eqlist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.eqrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid #f0f2f5}
.eqrow:first-child{border-top:0}
.eqrow.off{opacity:.6}
.eqrow .sel{padding:5px 8px}
.eqrow{flex-wrap:wrap}.eqrow .eqmail{flex:0 1 250px;min-width:0;border:1px solid #d5d9e2;border-radius:8px;padding:5px 8px;font-size:13px}
@media (max-width:820px){.eqrow .eqmail{order:5;flex:1 1 100%}}
.me-tag{font-size:11px;background:var(--navy);color:#fff;border-radius:8px;padding:1px 6px}
.bsub{margin-bottom:14px;flex-wrap:wrap;display:inline-flex}
.bsub button{font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi small{color:var(--muted);font-size:12px}
.kpi.neg b,.negt{color:var(--accent)!important}
.pbar{display:block;height:6px;background:#e9ecf2;border-radius:3px;overflow:hidden;min-width:50px}
.pbar i{display:block;height:100%;border-radius:3px}
.bblock{margin-bottom:22px}
.bblock h3{font-size:15px;margin:0 0 10px;color:var(--navy)}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowISO=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const parseD=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=(off=0)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return ymd(d)};
const fD=(s,o={weekday:'short',day:'numeric',month:'short'})=>s?parseD(s).toLocaleDateString('fr-FR',o):'';
// Vue mois : off = décalage en mois par rapport au mois courant
const monthStart=(off=0)=>{const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+off,1))};
const monthDays=ms=>{const d=parseD(ms);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const fMonth=ms=>{const t=fD(ms,{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)};
// Calendrier mensuel lun→dim. evs(d) renvoie une liste de {html,col,title,click} ; dayClick(d) = action au clic sur la case
function monthCal(ms,evs,dayClick,max=3){
  const t=today(), m=ms.slice(0,7), start=addDays(ms,-((parseD(ms).getDay()+6)%7));
  const nW=Math.ceil((((parseD(ms).getDay()+6)%7)+monthDays(ms))/7);
  const head=['lun','mar','mer','jeu','ven','sam','dim'].map(x=>`<div class="mh">${x}</div>`).join('');
  const cells=[...Array(nW*7)].map((_,i)=>{const d=addDays(start,i),w=parseD(d).getDay(),L=evs(d);
    const shown=L.slice(0,max).map(e=>`<span class="ev" style="background:${e.col}" title="${esc(e.title||'')}"${e.click?` onclick="event.stopPropagation();${e.click}"`:''}>${e.html}</span>`).join('');
    return `<div class="mc ${w===0||w===6?'we':''} ${d.slice(0,7)!==m?'out':''} ${d===t?'today':''} ${d<t?'past':''}" onclick="${dayClick(d)}"><span class="dn">${parseD(d).getDate()}</span>${shown}${L.length>max?`<span class="more">+${L.length-max} autre${L.length-max>1?'s':''}</span>`:''}</div>`}).join('');
  return `<div class="mcal">${head}${cells}</div>`;
}

const fDT=s=>s?fD(s)+' '+s.slice(11,16):'';
const mins=s=>(+s.slice(11,13))*60+(+s.slice(14,16));
const hue=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const pcol=s=>`hsl(${hue(s)} 52% 42%)`;
const initials=n=>String(n).split(/[\s-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const pill=n=>`<span class="pill"><i style="background:${pcol(n)}">${esc(initials(n))}</i>${esc(n)}</span>`;
const people=role=>{const a=D.Equipe.filter(e=>e.actif!=='non');const f=role?a.filter(e=>e.role===role):a;return (f.length?f:a).map(e=>e.nom).sort((x,y)=>x.localeCompare(y,'fr'))};

function toast(msg,ko){const t=document.createElement('div');t.className='toast'+(ko?' ko':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ko?4500:2200)}
function setSync(ok){const s=$('#sync');s.className='dot '+(ok?'ok':'ko');s.title=ok?'À jour':'Hors ligne / erreur'}

/* ---------- API ---------- */
async function api(action,p={}){
  if(DEMO) return demoApi(action,JSON.parse(JSON.stringify({user:me,...p})));
  if(FBM&&action!=='agenda'){if(!FB)throw new Error('Appli en cours de démarrage…');return FB.api(action,p)}
  const r=await fetch(CONFIG.apiUrl,{method:'POST',body:JSON.stringify({action,user:me,...p})});
  if(!r.ok) throw new Error('Serveur injoignable ('+r.status+')');
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'Erreur serveur');
  return j.data;
}
async function loadAll(silent){
  if(FBM){if(loaded)render();return} // Firebase : les données arrivent en direct
  try{
    const d=await api('all');
    for(const k in D) D[k]=d[k]||[];
    SRV=new Set(Object.keys(d||{}));
    // anciens libellés : Fermeture → À sortir, Ouverture → À ranger
    D.Cloisons.forEach(x=>{x.mouvement=({'Fermeture':'À sortir','Ouverture':'À ranger'})[x.mouvement]||x.mouvement});
    loaded=true; setSync(true); render(); ouvrirLien();
  }catch(e){ setSync(false); if(!silent) toast(e.message,1); if(!loaded) $('#view').innerHTML=`<div class="loading">Impossible de charger les données.<br>${esc(e.message)}<br><br><button class="btn" onclick="loadAll()">Réessayer</button></div>`; }
}
async function saveItem(sheet,item){
  const r=await api('save',{sheet,item});
  if(sheet==='Taches'&&item.prive==='oui'&&r.prive!=='oui'){ // Code.gs pas encore mis à jour : on n'expose pas la tâche perso à l'équipe
    try{await api('delete',{sheet,id:r.id})}catch(e){}
    throw new Error('Tâches perso pas encore actives : mets à jour le script (Déployer › Gérer les déploiements › Nouvelle version)');
  }
  const L=D[sheet]; const i=L.findIndex(x=>x.id===r.id);
  if(i<0) L.push(r); else L[i]=r;
  render(); return r;
}
async function delItem(sheet,id){
  await api('delete',{sheet,id});
  D[sheet]=D[sheet].filter(x=>x.id!==id);
  if(sheet==='Taches') D.Commentaires=D.Commentaires.filter(c=>c.tacheId!==id);
  if(sheet==='BudgetLignes') D.BudgetMvts=D.BudgetMvts.filter(m=>m.ligneId!==id);
  if(sheet==='Projets') D.ProjetMvts=D.ProjetMvts.filter(m=>m.projetId!==id);
  render();
}
function nacConflict(o){
  if(!o.debut||!o.fin) return 'Début et fin obligatoires';
  if(o.fin<=o.debut) return 'La fin doit être après le début';
  const c=D.Nacelle.find(b=>b.id!==o.id&&o.debut<b.fin&&b.debut<o.fin);
  return c?`Nacelle déjà réservée par ${c.nom} du ${fDT(c.debut)} au ${fDT(c.fin)}`:'';
}

/* ---------- 🛡️ Veille sûreté : salons sur le parc (J-7 → J+60) et bulletins de veille ----------
   Mêmes règles que l'export veille (scripts/export-veille/build.mjs) : EDL d'entrée = début de montage,
   EDL de sortie = fin de démontage ; à défaut, présence des régisseurs et mouvements de cloisons.
   Les bulletins sont des mémos de type « Veille sûreté » (même collection, mêmes droits, même « J'ai lu »). */
const SV_TYPE='Veille sûreté';
const svCle=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const svHalls=v=>String(v||'').split(/[,;/+]|\set\s/).map(h=>h.trim()).filter(Boolean);
const svMin=(a,b)=>!a?b:!b?a:a<b?a:b, svMax=(a,b)=>!a?b:!b?a:a>b?a:b;
const svD10=v=>/^\d{4}-\d{2}-\d{2}/.test(String(v||''))?String(v).slice(0,10):'';
const SV_PH={'À venir':'#3a6ea5','Montage':'#e09a2b','Ouvert au public':'#e63946','Sur site':'#e09a2b','Démontage':'#8e6bbf','Terminé':'#9aa3b2'};
if(!UI.sv) UI.sv={avant:7,apres:60,arch:false,fini:false};

function svSalons(){
  const t=today(), from=addDays(t,-UI.sv.avant), to=addDays(t,UI.sv.apres), S=new Map();
  const get=nom=>{const k=svCle(nom);if(!k)return null;
    if(!S.has(k))S.set(k,{k,nom:String(nom).trim(),halls:new Set(),dm:'',fd:'',pd:'',pf:'',edl:[]});return S.get(k)};
  D.EDL.forEach(x=>{if(x.statut==='Annulé')return;const s=get(x.salon),dt=svD10(x.date);if(!s||!dt)return;
    svHalls(x.halls).forEach(h=>s.halls.add(h));
    const type=['Entrée','Sortie','Intermédiaire'].includes(x.type)?x.type:'Intermédiaire';
    s.edl.push({type,date:dt,heure:x.heure||'',ok:x.confirmation==='Confirmé'});
    if(type==='Entrée')s.dm=svMin(s.dm,dt); if(type==='Sortie')s.fd=svMax(s.fd,dt)});
  D.Regisseurs.forEach(x=>{if(x.statut==='Annulé')return;const s=get(x.salon),a=svD10(x.dateDebut),b=svD10(x.dateFin)||a;if(!s||!a)return;
    s.pd=svMin(s.pd,a);s.pf=svMax(s.pf,b)});
  D.Cloisons.forEach(x=>{if(x.statut==='Annulé')return;const s=get(x.salon),a=svD10(x.date),b=svD10(x.dateFin)||a;if(!s||!a)return;
    svHalls(x.hall).forEach(h=>s.halls.add(h));s.pd=svMin(s.pd,a);s.pf=svMax(s.pf,b)});
  const ag=evtList();
  return [...S.values()].map(s=>{
    const debut=s.dm||s.pd, fin=s.fd||s.pf||debut;
    // ouverture au public : agenda GL events, même nom (ou l'un contenu dans l'autre) et dates dans la période sur site
    const pub=ag.find(e=>{const k=svCle(e.nom);return k&&(k===s.k||k.includes(s.k)||s.k.includes(k))&&e.d1>=debut&&e.d0<=fin});
    const halls=[...s.halls].sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
    let ph='Terminé';
    if(t<debut)ph='À venir'; else if(t<=fin)ph=!pub?'Sur site':t<pub.d0?'Montage':t<=pub.d1?'Ouvert au public':'Démontage';
    const hk=halls.map(svCle);
    const trav=D.Chantiers.filter(c=>!['Annulé','Terminé'].includes(c.statut)&&c.dateDebut&&(c.dateFin||c.dateDebut)>=debut&&c.dateDebut<=fin)
      .filter(c=>!hk.length||espList(c.espace).some(e=>hk.includes(svCle(e))));
    return {...s,debut,fin,halls,pub,ph,trav,est:!(s.dm&&s.fd),edl:s.edl.sort((a,b)=>a.date.localeCompare(b.date))};
  }).filter(s=>s.debut&&s.fin>=from&&s.debut<=to)
    .sort((a,b)=>a.debut.localeCompare(b.debut)||a.nom.localeCompare(b.nom,'fr'));
}
const svBulletins=()=>D.Memos.filter(m=>m.type===SV_TYPE);
const svDebut=m=>m.dateDebut||m.dateBulletin||(m.creeLe||'').slice(0,10);
// « du jour » : bulletins en cours (tous niveaux) dont la période de risque comprend aujourd'hui, repris dans le Mémo vigilance.
// Synthèses : seulement la plus récente.
const svSynth=m=>/^synth[eè]se veille/i.test(m.titre||'');
const svDuJour=()=>{const t=today(),L=svBulletins().filter(m=>memoActif(m)&&svDebut(m)<=t);
  const der=L.filter(svSynth).sort((x,y)=>(y.creeLe||'').localeCompare(x.creeLe||''))[0];
  return L.filter(m=>!svSynth(m)||m===der)};
// bulletins rattachés à un salon (champ salon, plusieurs possibles séparés par des virgules) ou à tout le parc
const svPour=(B,s)=>B.filter(m=>espList(m.salon).some(n=>{const k=svCle(n);return k&&(k===s.k||k.includes(s.k)||s.k.includes(k))}));
const svNiv=L=>L.reduce((a,m)=>Object.keys(MNIV).indexOf(m.niveau||'Info')>Object.keys(MNIV).indexOf(a)?m.niveau:a,'Info');

      ${st.arch?`<div class="mgrid" style="margin-top:10px">${arch.map(svCard).join('')}</div>`:''}</div>`:''}
    <div class="bar" style="margin-top:22px"><h3 style="margin:0">🎪 Salons sur le parc</h3><span class="hint">du ${fD(addDays(t,-st.avant),{day:'numeric',month:'short'})} au ${fD(addDays(t,st.apres),{day:'numeric',month:'short',year:'numeric'})}</span>
      <span class="sp"></span><label class="chk"><input type="checkbox" ${st.fini?'checked':''} onchange="UI.sv.fini=this.checked;render()"> Afficher les terminés</label></div>
    <p class="hint">Dates internes tirées de la Régie : état des lieux d'entrée (début de montage) et de sortie (fin de démontage), sinon présence des régisseurs et mouvements de cloisons. Ouverture au public d'après l'agenda GL events Lyon.</p>
    <div class="mgrid">${vis.map(s=>svSalonCard(s,B)).join('')||'<p class="empty">Aucun salon dans la période (vérifie les états des lieux dans 🎪 Régie évènementielle).</p>'}</div>`;
}
function svCard(m){
  const act=memoActif(m), t=m.texte||'';
  return `<div class="card mv-${esc(m.niveau||'Info')} ${act?'':'done'} ${act&&!memoLu(m)?'mnew':''}" onclick="svOpen('${m.id}')">
    <div class="ct"><span class="mlev" style="background:${MNIV[m.niveau]||MNIV.Info}">${esc((m.niveau||'Info').toUpperCase())}</span>${esc(m.titre)}</div>
    ${t?`<div class="cd memo">${esc(t.length>220?t.slice(0,220)+'…':t)}</div>`:''}
    <div class="meta">${m.dateBulletin?`<span>📅 ${fD(m.dateBulletin)}</span>`:''}${m.dateDebut&&m.dateDebut!==m.dateBulletin?`<span>⚠️ à partir du ${fD(m.dateDebut)}</span>`:''}<span>🎪 ${esc(m.salon||'Tout le parc')}</span>
      ${m.lieu?`<span>📍 ${esc(m.lieu)}</span>`:''}${m.jusquau?`<span>⏳ jusqu'au ${fD(m.jusquau)}</span>`:''}${memoLuHtml(m)}</div>
    ${act&&!memoLu(m)?`<button class="adv ok" style="margin-left:0" onclick="event.stopPropagation();memoSetLu('${m.id}',true,this)">✓ J'ai lu</button>`:''}
  </div>`;
}
function svSalonCard(s,B){
  const bl=svPour(B.filter(memoActif),s), d=(a,o)=>fD(a,o||{weekday:'short',day:'numeric',month:'short'});
  const col=bl.length?MNIV[svNiv(bl)]:SV_PH[s.ph];
  return `<div class="card svsal" style="border-left-color:${col}">
    <div class="ct"><span class="svph" style="background:${SV_PH[s.ph]}">${esc(s.ph)}</span>${esc(s.nom)}</div>
    ${s.halls.length?`<div class="meta"><span>📍 ${esc(s.halls.join(', '))}</span></div>`:''}
    <div class="svdates"><b>Montage</b><span>${d(s.debut)}${s.est?' <span class="hint">(estimé)</span>':''}</span>
      ${s.pub?`<b>Public</b><span>${s.pub.d0===s.pub.d1?d(s.pub.d0):d(s.pub.d0)+' → '+d(s.pub.d1)}</span>`:''}
      <b>Fin démontage</b><span>${d(s.fin)}${s.est?' <span class="hint">(estimé)</span>':''}</span>
      ${s.edl.length?`<b>EDL</b><span>${s.edl.map(e=>`${esc(e.type)} ${d(e.date,{day:'numeric',month:'short'})}${e.heure?' '+esc(e.heure):''}${e.ok?' ✓':' <span class="hint">(à confirmer)</span>'}`).join(' · ')}</span>`:''}</div>
    ${s.trav.length?`<div class="svwarn">🚧 <b>${s.halls.length?'Coactivité travaux':'Travaux sur le parc pendant le salon'} :</b> ${s.trav.map(c=>`${esc(c.titre)} (${esc(espList(c.espace).join(', '))}${c.entreprise?' · '+esc(c.entreprise):''}, ${d(c.dateDebut,{day:'numeric',month:'short'})} → ${d(c.dateFin||c.dateDebut,{day:'numeric',month:'short'})})`).join(' · ')}</div>`:''}
    ${bl.length?`<div class="svbul">📰 ${bl.map(m=>`<a href="#" onclick="svOpen('${m.id}');return false"><b style="color:${MNIV[m.niveau]||MNIV.Info}">${esc(m.niveau||'Info')}</b> · ${esc(m.titre)}</a>`).join('<br>📰 ')}</div>`:''}
    <div class="acts" style="margin-top:8px"><button class="btn sm" onclick="svNew(${esc(JSON.stringify(s.nom))},${esc(JSON.stringify(s.halls.join(', ')))})">+ Bulletin pour ce salon</button></div>

/* ---------- Applis intégrées (Devis EDL, Relevés compteurs, Consommations halls) : même compte Firebase, gardées chargées d'un onglet à l'autre ---------- */

  Devis:{l:'🧾 Devis EDL',h:'Application devis BatiScript (réserves des salons)',u:'https://eurexpobatiment.github.io/devis/v2/'},
  Compteurs:{l:'💧 Relevés compteurs',h:'Relevés mensuels eau, électricité, gaz, fioul (Dalkia)',u:'https://eurexpobatiment.github.io/compteurs/'},

  w.innerHTML=`<div class="dvbar"><b>${a.l}</b><span class="hint">${esc(a.h)}</span><span class="sp"></span>

function render(){
  $('#apptitle').textContent=CONFIG.titre;

  const mine=D.Taches.filter(aFaire).length;
  navRender(mine);
  if(!loaded) return;
  const el=$('#view');
  if(APPS[tab])return vApp(tab,el);
  el.hidden=false;document.querySelectorAll('.appWrap').forEach(x=>x.hidden=true);document.body.style.overflow='';
  ({Memo:vMemo,Taches:vTaches,Nacelle:vNacelle,Regie:vRegie,Surete:vSurete,Equipe:vEquipe,Budget:vBudget,Projets:vProjets,Travaux:vTravauxHub,Planning:vPlanning,Demandes:vTravaux,Clefs:vClefs,Docs:vDocs})[tab](el);
  hallsDatalist(); budgetDatalists();
  if(!FBM&&(!me||!people().includes(me))&&!$('.ov')) pickUser();
}
function navRender(mine){
  const ico=t=>icoSvg(t.id)||t.l.split(' ')[0], nom=t=>t.l.slice(t.l.indexOf(' ')+1);
  const btn=t=>`<button class="${t.id===tab?'on':''}" onclick="goTab('${t.id}')" title="${esc(nom(t))}"><span class="ni">${ico(t)}</span><span class="nl">${esc(nom(t))}</span>${tabBadge(t.id,mine)}</button>`;
  const TV=TABS, grps=[...new Set(TV.map(t=>t.g))];

/* ---------- modale & formulaires ---------- */
let modalLocked=false;
function modal(html,locked){
  closeModal(true); modalLocked=!!locked;
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="mod">${html}</div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!modalLocked)closeModal()});
  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const f=ov.querySelector('input:not([type=date]):not([type=time]):not([type=datetime-local]),textarea');
  if(f&&window.innerWidth>820) f.focus();
}
function closeModal(force){if(modalLocked&&!force)return;const o=$('.ov');if(o)o.remove();document.body.style.overflow='';modalLocked=false;if(liveRender.p)liveRender()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function fieldHtml(f,v){
  const id='f_'+f.k, val=esc(v??''); let inp;
  switch(f.t){
    case 'textarea': inp=`<textarea id="${id}" rows="${f.rows||3}">${val}</textarea>`;break;
    case 'select': inp=`<select id="${id}">${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;break;
    case 'person':{const ns=people(f.filter);if(v&&!ns.includes(v))ns.push(v);
      inp=`<select id="${id}"><option value="">—</option>${ns.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;break;}
    case 'date': inp=`<input type="date" id="${id}" value="${val}">`;break;
    case 'time': inp=`<input type="time" id="${id}" value="${val}" step="300">`;break;
    case 'datetime': inp=`<input type="datetime-local" id="${id}" value="${val}" step="300">`;break;
    case 'hall': inp=`<input id="${id}" list="dl-halls" value="${val}" autocomplete="off">`;break;
    case 'people':{const sel=espList(v),ns=people(f.filter);sel.forEach(n=>{if(!ns.includes(n))ns.push(n)});
      inp=`<div class="multi" id="${id}">${ns.map(n=>`<label class="mchip"><input type="checkbox" value="${esc(n)}" ${sel.includes(n)?'checked':''}><span>${esc(n)}</span></label>`).join('')||'<span class="hint">Personne dans l\'équipe pour l\'instant.</span>'}</div>`;break;}
    case 'multi':{const sel=espList(v),opts=f.o(),autres=sel.filter(s=>!opts.includes(s));
      inp=`<div class="multi" id="${id}">${opts.map(o=>`<label class="mchip"><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}
        <input class="mother" placeholder="Autre espace (séparer par des virgules)" value="${esc(autres.join(', '))}"></div>`;break;}
    case 'dl': inp=`<input id="${id}" list="${f.dl}" value="${val}" autocomplete="off">`;break;
    case 'qte': inp=`<input id="${id}" type="number" min="0" step="1" inputmode="numeric" value="${val}">`;break;
    case 'money': inp=`<input id="${id}" inputmode="decimal" value="${esc(v===''||v==null?'':String(v).replace('.',','))}" autocomplete="off">`;break;
    default: inp=`<input id="${id}" value="${val}" autocomplete="off">`;
  }
  return (f.t==='multi'||f.t==='people')?`<div class="fl full"><span>${esc(f.l)}${f.req?' *':''}</span>${inp}</div>`:`<label class="fl ${f.t==='textarea'||f.full?'full':''}"><span>${esc(f.l)}${f.req?' *':''}</span>${inp}</label>`;
}
function openForm(sheet,item,title,opt={}){
  const F=opt.fields||FORMS[sheet]; const it={...(item||{})}; const isNew=!it.id;
  F.forEach(f=>{if((it[f.k]==null||it[f.k]==='')&&f.def!==undefined)it[f.k]=f.def});
  hallsDatalist(); budgetDatalists();
  modal(`<h2>${esc(title)}</h2><div class="form">${F.map(f=>fieldHtml(f,it[f.k])).join('')}</div>
    <div class="err" id="ferr"></div>
    <div class="acts">${!isNew?'<button class="btn danger" id="fdel">Supprimer</button>':''}<span class="sp"></span>
      <button class="btn" onclick="closeModal()">Annuler</button><button class="btn pri" id="fsave">Enregistrer</button></div>
    ${opt.extra||''}`);
  const ferr=m=>{$('#ferr').textContent=m||''};
  $('#fsave').onclick=async()=>{
    const o={...it};
    F.forEach(f=>{let v=f.t==='people'?[...$('#f_'+f.k).querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value).join(', '):f.t==='multi'?[...$('#f_'+f.k).querySelectorAll('input[type=checkbox]:checked')].map(i=>i.value).concat(espList($('#f_'+f.k).querySelector('.mother').value)).filter((x,i,a)=>a.indexOf(x)===i).join(', '):$('#f_'+f.k).value.trim();if(f.t==='datetime')v=v.slice(0,16);if(f.t==='time')v=v.slice(0,5);o[f.k]=v});
    const miss=F.filter(f=>f.req&&!o[f.k]);
    if(miss.length) return ferr('À renseigner : '+miss.map(f=>f.l).join(', '));
    if(opt.validate){const m=opt.validate(o);if(m)return ferr(m)}
    const b=$('#fsave'); b.disabled=true; b.textContent='Enregistrement…';
    try{const r=await saveItem(sheet,o);closeModal();toast('Enregistré ✓');if(opt.onSaved)opt.onSaved(r)}
    catch(e){ferr(e.message);b.disabled=false;b.textContent='Enregistrer'}
  };
  if(!isNew){const d=$('#fdel');d.onclick=async()=>{
    if(!d.classList.contains('arm')){d.classList.add('arm');d.textContent='Confirmer la suppression';return}
    d.disabled=true;
    try{await delItem(sheet,it.id);closeModal();toast('Supprimé')}catch(e){ferr(e.message);d.disabled=false}
  }}
  if(opt.after) opt.after();
}

/* ================== TÂCHES ================== */
const asg=t=>String(t.assigne||'').split(',').map(x=>x.trim()).filter(Boolean); // une ou plusieurs personnes, « Julien, Karim »
const isMine=t=>!!me&&asg(t).includes(me);
const fait=t=>{const a=asg(t);return a.length>1?String(t.faitPar||'').split(',').map(x=>x.trim()).filter(n=>a.includes(n)):[]}; // qui a fini sa part
const perso=t=>t.prive==='oui'; // tâche perso : visible par son auteur seulement
const aFaire=t=>isMine(t)&&t.statut!=='Terminé'&&!fait(t).includes(me); // compteur « mes tâches »
function partsHtml(t){ // personnes attribuées, avec ✓ pour celles qui ont fini leur part
  const a=asg(t), f=fait(t), multi=a.length>1&&t.statut!=='Terminé';
  if(!a.length) return '<span class="pill ghost">Non attribuée</span>';
  return a.map(n=>multi&&f.includes(n)?pill(n).replace('class="pill"','class="pill fini" title="Part terminée"').replace('</span>',' ✓</span>'):pill(n)).join('')
    +(multi?`<span class="parts">${f.length}/${a.length} parts faites</span>`:'');
}
function partBtn(t){ // bouton « Ma part faite » pour une tâche à plusieurs
  if(asg(t).length<2||t.statut==='Terminé'||!isMine(t)) return '';
  return fait(t).includes(me)
    ?`<button class="adv undo" onclick="event.stopPropagation();maPart('${t.id}',false,this)">↩ Annuler ma part</button>`
    :`<button class="adv ok" onclick="event.stopPropagation();maPart('${t.id}',true,this)">✓ Ma part faite</button>`;
}
async function maPart(id,ok,btn){
  if(!me) return toast("Choisis d'abord ton nom (bouton 👤)",1);
  if(btn){btn.disabled=true;btn.textContent='…'}
  try{
    const r=await api('partFaite',{id,fait:ok});
    const i=D.Taches.findIndex(x=>x.id===r.id); if(i<0)D.Taches.push(r); else D.Taches[i]=r;
    if($('#tparts'))$('#tparts').innerHTML=partsHtml(r)+partBtn(r);
    render(); toast(r.statut==='Terminé'?'Tout le monde a fini : tâche terminée ✓':ok?'Ta part est notée ✓':'Ta part est décochée');
  }catch(e){toast(e.message,1);render()}
}
function vTaches(el){
  const names=people(); const f=UI.tFiltre, P=UI.tVue==='perso';
  let L=D.Taches.filter(t=>P?perso(t)&&t.creePar===me:!perso(t));
  if(!P){
    if(f==='Moi')L=L.filter(isMine);
    else if(f==='Non attribuées')L=L.filter(t=>!asg(t).length);
    else if(f!=='Tous')L=L.filter(t=>asg(t).includes(f));
  }
  const nb=fn=>D.Taches.filter(t=>fn(t)&&aFaire(t)).length, nE=nb(t=>!perso(t)), nP=nb(t=>perso(t)&&t.creePar===me);
  const seg=[['equipe',"👥 Tâches de l'équipe",nE],['perso','🔒 Mes tâches perso',nP]].map(([k,l,n])=>`<button class="${UI.tVue===k?'on':''}" onclick="UI.tVue='${k}';UI.tTout=false;render()">${l}${n?` <span class="badge">${n}</span>`:''}</button>`).join('');
  const pi=t=>PRIO.indexOf(t.priorite||'Normale');
  const cols=ST_TACHE.map(st=>{
    let c=L.filter(t=>(t.statut||'À faire')===st), total=c.length, more=0;
    if(st==='Terminé'){c.sort((a,b)=>(b.majLe||'').localeCompare(a.majLe||''));if(!UI.tTout&&c.length>8){more=c.length-8;c=c.slice(0,8)}}
    else c.sort((a,b)=>pi(b)-pi(a)||(a.echeance||'9999').localeCompare(b.echeance||'9999'));
    return `<div class="col"><h3>${st}<span class="n">${total}</span></h3>${c.map(card).join('')||'<p class="empty">Rien ici</p>'}
      ${more?`<button class="link" onclick="UI.tTout=true;render()">+ ${more} plus anciennes</button>`:''}</div>`;
  });
  el.innerHTML=`<div class="bar"><h2>Tâches</h2><div class="seg-ctl">${seg}</div>
    ${P?'':`<select class="sel" onchange="UI.tFiltre=this.value;render()">${['Tous','Moi','Non attribuées',...names].map(n=>`<option ${n===f?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
    <button class="btn pri" onclick="editTache()">+ ${P?'Tâche perso':'Nouvelle tâche'}</button></div>
    ${P?`<p class="hint">🔒 Tes tâches à toi : elles n'apparaissent ni dans les tâches de l'équipe ni chez les autres.${me?'':' Choisis d\'abord ton nom (bouton 👤).'}</p>`:''}
    <div class="kanban">${cols.join('')}</div>`;
}
function card(t){
  const st=t.statut||'À faire', done=st==='Terminé';
  const late=t.echeance&&!done&&t.echeance<today();
  const nc=D.Commentaires.filter(c=>c.tacheId===t.id).length;
  const multi=asg(t).length>1;
  const next={'À faire':'En cours','En cours':multi?'':'Terminé'}[st]; // à plusieurs : terminé quand chacun a coché sa part
  const d=(t.description||'');
  return `<div class="card p${PRIO.indexOf(t.priorite||'Normale')} ${done?'done':''}" onclick="editTache('${t.id}')">
    <div class="ct">${perso(t)?'🔒 ':''}${t.priorite==='Urgente'&&!done?'<span class="tag-u">URGENT</span> ':''}${esc(t.titre)}</div>
    ${d?`<div class="cd">${esc(d.length>140?d.slice(0,140)+'…':d)}</div>`:''}
    <div class="meta">${perso(t)?'':partsHtml(t)}
      ${t.echeance?`<span class="${late?'late':''}">📅 ${fD(t.echeance)}${late?' · en retard':''}</span>`:''}
      ${t.lieu?`<span>📍 ${esc(t.lieu)}</span>`:''}${nc?`<span>💬 ${nc}</span>`:''}</div>
    ${next?`<button class="adv" onclick="event.stopPropagation();advance('${t.id}',this)">→ ${next}${next==='En cours'&&!asg(t).length?' (je la prends)':''}</button>`:''}${partBtn(t)}
  </div>`;
}
async function advance(id,btn){
  const t=D.Taches.find(x=>x.id===id); if(!t) return;
  const next={'À faire':'En cours','En cours':'Terminé'}[t.statut||'À faire'];
  const o={...t,statut:next}; if(next==='En cours'&&!asg(o).length)o.assigne=me;
  if(btn){btn.disabled=true;btn.textContent='…'}
  try{await saveItem('Taches',o);toast(next==='Terminé'?'Tâche terminée ✓':'Tâche en cours')}catch(e){toast(e.message,1);render()}
}
function comsHtml(tid){
  const cs=D.Commentaires.filter(c=>c.tacheId===tid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return cs.map(c=>`<div class="com"><div class="ch">${pill(c.auteur||'?')}<span>${fDT(c.date)}</span>

function editTache(id){
  const t=id?D.Taches.find(x=>x.id===id):UI.tVue==='perso'?{prive:'oui',assigne:me}:{assigne:UI.tFiltre==='Moi'?me:''};
  if(id&&!t) return;
  if(!id&&perso(t)&&!me) return toast("Choisis d'abord ton nom (bouton 👤)",1);
  const P=perso(t);
  const extra=id?`${asg(t).length>1?`<div class="tparts"><h3>Avancement par personne</h3><div id="tparts" class="meta">${partsHtml(t)}${partBtn(t)}</div>
    <p class="hint">La tâche passe en « Terminé » quand chaque personne a coché « Ma part faite ». On peut aussi la clôturer d'office avec le statut ci-dessus.</p></div>`:''}<div class="made">Créée par ${esc(t.creePar||'?')} le ${fDT(t.creeLe)}${t.majPar?` · modifiée par ${esc(t.majPar)} le ${fDT(t.majLe)}`:''}</div>
    <div class="coms"><h3>Échanges &amp; avancement</h3><div id="clist">${comsHtml(id)}</div>
    <div class="cadd"><textarea id="ctxt" rows="2" placeholder="Ajouter un commentaire, un point d'avancement…"></textarea><button class="btn pri" id="csend">Envoyer</button></div></div>`:'';
  openForm('Taches',t,P?(id?'🔒 Tâche perso':'🔒 Nouvelle tâche perso'):id?'Tâche':'Nouvelle tâche',{extra:(P?'<p class="hint">🔒 Visible par toi seulement.</p>':'')+extra,
    fields:P?FORMS.Taches.filter(f=>f.k!=='assigne'):undefined,after:()=>{
    if(!id) return;

function vNacelle(el){
  if(UI.nView==='mois') return vNacelleMois(el);
  const ws=monday(UI.nWeek), days=[...Array(7)].map((_,i)=>addDays(ws,i)), t=today(), H0=6, H1=22, span=(H1-H0)*60;
  const now=nowISO();
  const mineNext=D.Nacelle.filter(b=>b.nom===me&&b.fin>=now).sort((a,b)=>a.debut.localeCompare(b.debut)).slice(0,3);
  const ticks=[6,8,10,12,14,16,18,20,22].map(h=>`<span class="tk" style="left:${(h-H0)*60/span*100}%">${h}h</span>`).join('');
  const rows=days.map(d=>{
    const d0=d+'T00:00', d1=addDays(d,1)+'T00:00';
    const bs=D.Nacelle.filter(b=>b.debut<d1&&b.fin>d0).sort((a,b)=>a.debut.localeCompare(b.debut));
    const segs=bs.map(b=>{
      const s=b.debut<d0?H0*60:Math.max(H0*60,mins(b.debut)), e=b.fin>=d1?H1*60:Math.min(H1*60,mins(b.fin));
      if(e<=s) return '';
      return `<div class="seg" style="left:${(s-H0*60)/span*100}%;width:${(e-s)/span*100}%;background:${pcol(b.nom)}" title="${esc(b.nom)} · ${fDT(b.debut)} → ${fDT(b.fin)}${b.lieu?' · '+esc(b.lieu):''}" onclick="editNac('${b.id}')">${esc(b.nom)}</div>`;
    }).join('');
    const nowLine=d===t&&mins(now)>=H0*60&&mins(now)<=H1*60?`<div class="now" style="left:${(mins(now)-H0*60)/span*100}%"></div>`:'';
    const list=bs.map(b=>{
      const same=b.debut.slice(0,10)===d&&b.fin.slice(0,10)===d;
      const h=same?`${b.debut.slice(11)}–${b.fin.slice(11)}`:`${b.debut.slice(0,10)===d?b.debut.slice(11):'…'}–${b.fin.slice(0,10)===d?b.fin.slice(11):'…'}`;
      return `<div class="bk" onclick="editNac('${b.id}')"><span class="h">${h}</span><span>${pill(b.nom)}</span><span class="m">${esc([b.lieu,b.motif].filter(Boolean).join(' · '))}${same?'':' (du '+fDT(b.debut)+' au '+fDT(b.fin)+')'}</span></div>`;
    }).join('');
    return `<div class="day ${d===t?'today':''} ${d<t?'past':''}"><div class="dh"><b>${fD(d,{weekday:'long',day:'numeric',month:'long'})}</b>
      <button class="btn sm" onclick="newNac('${d}')">+ Réserver</button></div>
      <div class="tl">${ticks}${segs}${nowLine}</div>${list||'<div class="free">Libre</div>'}</div>`;
  }).join('');
  el.innerHTML=`<div class="bar"><h2>Planning nacelle</h2>${viewCtl('sem','UI.nView')}
    <button class="btn" onclick="UI.nWeek--;render()">‹</button><button class="btn" onclick="UI.nWeek=0;render()">Cette semaine</button><button class="btn" onclick="UI.nWeek++;render()">›</button>
    <button class="btn pri" onclick="newNac()">+ Réserver la nacelle</button></div>
    <p class="hint">Semaine du ${fD(ws,{day:'numeric',month:'long'})} au ${fD(addDays(ws,6),{day:'numeric',month:'long',year:'numeric'})} · frise de 6 h à 22 h</p>
    ${mineNext.length?`<div class="mine"><b>Tes prochaines réservations :</b> ${mineNext.map(b=>`<a href="#" onclick="editNac('${b.id}');return false">${fDT(b.debut)} → ${b.fin.slice(0,10)===b.debut.slice(0,10)?b.fin.slice(11):fDT(b.fin)}</a>`).join(' · ')}</div>`:''}
    <div class="days">${rows}</div>`;
}
function vNacelleMois(el){
  const ms=monthStart(UI.nMonth);
  const evs=d=>{const d0=d+'T00:00',d1=addDays(d,1)+'T00:00';
    return D.Nacelle.filter(b=>b.debut<d1&&b.fin>d0).sort((a,b)=>a.debut.localeCompare(b.debut)).map(b=>{
      const h=b.debut.slice(0,10)===d?b.debut.slice(11,13).replace(/^0/,'')+'h'+(b.debut.slice(14,16)==='00'?'':b.debut.slice(14,16)):'…';

function newNac(d){

  const h=+deb.slice(11,13)+2, fin=base+'T'+pad(Math.min(h,22))+':'+deb.slice(14,16);

}

const CH_ACTIF=s=>!['Terminé','Annulé'].includes(s||'Prévu');

  return D.Chantiers.filter(o=>o.id!==c.id&&CH_ACTIF(o.statut)&&o.dateDebut<=c.dateFin&&c.dateDebut<=o.dateFin&&espList(o.espace).some(x=>es.includes(x.toLowerCase())));

function salons(){ // salons déduits des états des lieux (entrée → sortie)
  const m={}; D.EDL.forEach(x=>{if(!x.salon||x.statut==='Annulé')return;const k=x.salon.trim();const s=m[k]||(m[k]={nom:k,d0:x.date,d1:x.date,halls:new Set()});
    if(x.date<s.d0)s.d0=x.date;if(x.date>s.d1)s.d1=x.date;(x.halls||'').split(/[,;]/).map(h=>h.trim()).filter(Boolean).forEach(h=>s.halls.add(h))});

async function bExport(){
  try{
    if(!window.XLSX){toast('Préparation du fichier…');await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Export indisponible (pas de connexion ?)'));document.head.appendChild(s)})}
    const r2=n=>Math.round(n*100)/100;
    const lignes=type=>bLines(type).map(l=>{const c=bCalc(l);const o={'Famille':l.famille,'Code':l.code,'Prestataire':l.prestataire,'Intitulé':l.intitule,'Budget 2026':l.budget===''?'':r2(c.bud)};
      if(type==='Contrat'){o['BDC']=r2(c.bdc);o['Factures']=r2(c.fac);o['BC']=l.bc}else o['Engagé']=r2(c.eng);
      o['Restant']=r2(c.rest);o['%']=isFinite(c.pct)?r2(c.pct*100):'';o['État']=c.bud===0&&c.eng===0?'':c.hors?'HORS BUDGET':'OK';o['Hors total']=l.horsTotal==='oui'?'oui':'';o['Note']=l.note;return o});
    const byId=Object.fromEntries(D.BudgetLignes.map(l=>[l.id,l]));
    const mv=D.BudgetMvts.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>{const l=byId[m.ligneId]||{};return {'Date':m.date,'Type':l.type,'Code':l.code,'Intitulé':l.intitule,'Prestataire':l.prestataire,'Nature':m.nature,'N°':m.numero,'Libellé':m.libelle,'Montant HT':r2(num(m.montant)*(m.nature==='Avoir'?-1:1)),'Saisi par':m.majPar}});
    const wb=XLSX.utils.book_new(), add=(rows,name)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'':''}]);ws['!cols']=Object.keys(rows[0]||{a:1}).map(k=>({wch:Math.min(48,Math.max(10,k.length+2,...rows.map(r=>String(r[k]??'').length+1)))}));XLSX.utils.book_append_sheet(wb,ws,name)};
    add(lignes('Entretien'),'Entretien BA24'); add(lignes('Contrat'),'Contrats BA25'); add(mv,'Mouvements');
    add(D.Inventaire.map(i=>({'Responsable':i.responsable,'Désignation':i.designation,'Code EBMS':i.code,'Montant HT':isPureNum(i.montant)?num(i.montant):i.montant,'Commentaire':i.commentaire,'Avancement':i.avancement})),'Travaux prévus');
    add(D.SAP.map(s=>({'Société':s.societe,'N° SAP':s.sap})),'N° SAP');
    XLSX.writeFile(wb,`Budget bâtiment 2026 - ${today()}.xlsx`);
  }catch(e){toast(e.message,1)}
}

/* ================== 📊 SUIVI FINANCIER DE PROJETS (perso) ==================
   Projets visibles par leur propriétaire seulement (Firebase : champ proprio, règles Projets / ProjetMvts).
   Devis = reçus (pour info) · Engagé = BDC · Facturé = factures − avoirs
   Reste à engager = budget − engagé · Reste à payer = engagé − facturé */
const NAT_PJ=['Devis','BDC','Facture','Avoir'];
const PJ_ST={'À l\'étude':'#3a6ea5','En cours':'#e09a2b','Terminé':'#2a9d5c','Clôturé':'#64748b','Annulé':'#9aa3b2'};
const pjMine=()=>D.Projets.filter(p=>p.proprio===me);
const pjLignes=id=>[...new Set(D.ProjetMvts.filter(m=>m.projetId===id&&m.nature==='BDC'&&m.ligne).map(m=>m.ligne))]; // lignes budgétaires des BDC du projet
function pjCalc(p){
  let dev=0,bdc=0,fac=0;
  D.ProjetMvts.forEach(m=>{if(m.projetId!==p.id)return;const v=num(m.montant);
    if(m.nature==='Devis')dev+=v;else if(m.nature==='BDC')bdc+=v;else if(m.nature==='Facture')fac+=v;else if(m.nature==='Avoir')fac-=v});
  const bud=num(p.budget), resteEng=bud-bdc, resteFac=bdc-fac;
  return {dev,bdc,fac,bud,resteEng,resteFac,pct:bud?bdc/bud:(bdc?Infinity:0),pctFac:bud?fac/bud:0,hors:p.budget!==''&&bud>0&&(bdc>bud+0.005||fac>bud+0.005),surFac:fac>bdc+0.005};
}
function vProjets(el){
  const st=UI.pj||(UI.pj={f:'actifs',q:''}), q=st.q.trim().toLowerCase();
  const all=pjMine(), act=p=>!['Clôturé','Annulé'].includes(p.statut);
  let L=all.filter(p=>st.f==='tous'||(st.f==='actifs'?act(p):!act(p)));
  if(q) L=L.filter(p=>[p.titre,p.entreprise,p.note].join(' ').toLowerCase().includes(q)||D.ProjetMvts.some(m=>m.projetId===p.id&&[m.numero,m.fournisseur,m.ligne,m.libelle].join(' ').toLowerCase().includes(q)));
  L.sort((a,b)=>Object.keys(PJ_ST).indexOf(a.statut)-Object.keys(PJ_ST).indexOf(b.statut)||(a.dateFin||'9999').localeCompare(b.dateFin||'9999')||a.titre.localeCompare(b.titre,'fr'));
  const s={bud:0,dev:0,bdc:0,fac:0}; L.filter(p=>p.statut!=='Annulé').forEach(p=>{const c=pjCalc(p);s.bud+=c.bud;s.dev+=c.dev;s.bdc+=c.bdc;s.fac+=c.fac});
  const rE=s.bud-s.bdc, rF=s.bdc-s.fac, pc=s.bud?s.bdc/s.bud:0;
  const filt=[['actifs','En cours'],['clos','Clôturés'],['tous','Tous']].map(([k,l])=>`<button class="${st.f===k?'on':''}" onclick="UI.pj.f='${k}';render()">${l}</button>`).join('');
  const row=p=>{const c=pjCalc(p);return `<tr class="pjrow" onclick="pjOpen('${p.id}')">
    <td><b>${esc(p.titre)}</b><small>${esc([p.entreprise,pjLignes(p.id).join(', '),p.dateFin&&('fin '+fD(p.dateFin,{day:'2-digit',month:'2-digit',year:'2-digit'}))].filter(Boolean).join(' · '))}</small></td>
    <td><span class="etat pjst" style="background:${PJ_ST[p.statut]||'#64748b'};color:#fff">${esc(p.statut||'')}</span>${c.hors?' <span class="etat ko">Hors budget</span>':''}${c.surFac?' <span class="etat ko" title="Plus facturé que commandé">Factures &gt; BDC</span>':''}</td>
    <td class="r">${p.budget===''?'—':eur(c.bud)}</td><td class="r">${c.dev?eur(c.dev):'—'}</td><td class="r">${eur(c.bdc)}</td><td class="r">${eur(c.fac)}</td>
    <td class="r ${c.resteEng<-0.005?'negt':''}">${p.budget===''?'—':eur(c.resteEng)}</td><td class="r ${c.resteFac<-0.005?'negt':''}">${eur(c.resteFac)}</td>
    <td class="pc">${p.budget===''?'':barHtml(c.pct)+`<small>${pctTxt(c.pct)}</small>`}</td></tr>`};
  el.innerHTML=`<div class="bar"><h2>Suivi financier de projets</h2><span class="sp"></span>${all.length?'<button class="btn" onclick="pjExport()">⬇️ Export Excel</button>':''}<button class="btn pri" onclick="pjNew()">+ Projet</button></div>
    <p class="hint">🔒 Tes projets à toi : chaque membre de l'équipe a son propre suivi, personne d'autre ne voit tes projets. Montants en € HT : devis reçus (pour info), engagé = BDC, facturé = factures − avoirs.</p>
    ${globalThis.PROJ_ERR?`<div class="docwarn">⚠️ Onglet pas encore activé dans Firebase (${esc(globalThis.PROJ_ERR)}).<br>Publie les nouvelles règles : console Firebase › Firestore Database › Règles.</div>`:''}
    <div class="kpis"><div class="kpi"><span>Budget</span><b>${eur(s.bud)}</b></div><div class="kpi"><span>Engagé (BDC)</span><b>${eur(s.bdc)}</b></div>
      <div class="kpi"><span>Facturé</span><b>${eur(s.fac)}</b></div><div class="kpi ${rE<0?'neg':''}"><span>Reste à engager</span><b>${eur(rE)}</b></div>
      <div class="kpi"><span>Reste à payer</span><b>${eur(rF)}</b></div><div class="kpi"><span>Engagé / budget</span><b>${pctTxt(pc)}</b>${barHtml(pc)}</div></div>
    <div class="bar"><div class="seg-ctl">${filt}</div><input class="search" type="search" placeholder="Rechercher (projet, entreprise, n° BDC…)" value="${esc(st.q)}" oninput="UI.pj.q=this.value;bRefreshTable()"></div>
    ${L.length?`<div class="tblwrap"><table class="btbl"><thead><tr><th>Projet</th><th>Statut</th><th class="r">Budget</th><th class="r">Devis</th><th class="r">Engagé</th><th class="r">Facturé</th><th class="r">Reste à engager</th><th class="r">Reste à payer</th><th>%</th></tr></thead><tbody>${L.map(row).join('')}</tbody></table></div>`
      :`<p class="empty">${all.length?'Aucun projet ici.':'Aucun projet pour l\'instant : crée ton premier projet.'}</p>`}`;
}

function pjNew(){openForm('Projets',{},'Nouveau projet',{validate:pjVal,extra:'<p class="hint">Une fois le projet enregistré, tu pourras y saisir devis, BDC, factures et avoirs.</p>',onSaved:r=>pjOpen(r.id)})}

function pjMvRender(id){

function pjLg(){const b=$('#pm_nat').value==='BDC';$('#pm_lig').hidden=!b;if(!b)$('#pm_lig').value=''}
// Clic sur une ligne : ses valeurs passent dans la saisie, « Ajouter » devient « Enregistrer la modification »
function pjMvEdit(mid){
  const m=D.ProjetMvts.find(x=>x.id===mid); if(!m||!$('#pm_add')) return;
  UI.pjEd=mid;
  $('#pm_date').value=m.date||today(); $('#pm_nat').value=m.nature; $('#pm_num').value=m.numero||''; $('#pm_fou').value=m.fournisseur||'';

function pjMvReset(){
  const mid=UI.pjEd, m=D.ProjetMvts.find(x=>x.id===mid); UI.pjEd='';
  ['pm_num','pm_mt','pm_lib','pm_lig'].forEach(k=>$('#'+k).value=''); $('#pm_date').value=today();

async function pjMvAdd(id){
  const mt=$('#pm_mt').value.trim(); if(!isPureNum(mt)) return toast('Montant : saisis un nombre (ex. 1 234,56)',1);
  const b=$('#pm_add'), done=setBusy(b,'…');
  const ed=UI.pjEd;
  try{await saveItem('ProjetMvts',{...(ed?{id:ed}:{}),projetId:id,date:$('#pm_date').value||today(),nature:$('#pm_nat').value,numero:$('#pm_num').value.trim(),fournisseur:$('#pm_fou').value.trim(),ligne:$('#pm_lig').value.trim(),montant:mt,libelle:$('#pm_lib').value.trim()});
    done(); if(ed){pjMvReset();toast('Modifié ✓')}else{['pm_num','pm_mt','pm_lib','pm_lig'].forEach(k=>$('#'+k).value='');toast('Ajouté ✓')}}catch(e){done();toast(e.message,1)}

async function pjMvDel(mid,id,btn){
  if(!btn.classList.contains('arm')){btn.classList.add('arm');btn.textContent='Confirmer';return}
  btn.disabled=true; try{await delItem('ProjetMvts',mid);if(UI.pjEd===mid)pjMvReset()}catch(e){toast(e.message,1)} pjMvRender(id);
}
async function pjExport(){
  try{
    if(!window.XLSX){toast('Préparation du fichier…');await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Export indisponible (pas de connexion ?)'));document.head.appendChild(s)})}
    const r2=n=>Math.round(n*100)/100, P=pjMine(), byId=Object.fromEntries(P.map(p=>[p.id,p]));
    const pr=P.map(p=>{const c=pjCalc(p);return {'Projet':p.titre,'Statut':p.statut,'Entreprise(s)':p.entreprise,'Lignes budgétaires (BDC)':pjLignes(p.id).join(', '),'Début':p.dateDebut,'Fin prévue':p.dateFin,
      'Budget HT':p.budget===''?'':r2(c.bud),'Devis HT':r2(c.dev),'Engagé (BDC) HT':r2(c.bdc),'Facturé HT':r2(c.fac),'Reste à engager':p.budget===''?'':r2(c.resteEng),'Reste à payer':r2(c.resteFac),'% engagé':c.bud?r2(c.pct*100):'','Note':p.note}});
    const mv=D.ProjetMvts.filter(m=>byId[m.projetId]).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(m=>({'Date':m.date,'Projet':byId[m.projetId].titre,'Nature':m.nature,'N°':m.numero,'Entreprise':m.fournisseur,'Ligne budgétaire':m.ligne,'Libellé':m.libelle,'Montant HT':r2(num(m.montant)*(m.nature==='Avoir'?-1:1))}));
    const wb=XLSX.utils.book_new(), add=(rows,name)=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'':''}]);ws['!cols']=Object.keys(rows[0]||{a:1}).map(k=>({wch:Math.min(48,Math.max(10,k.length+2,...rows.map(r=>String(r[k]??'').length+1)))}));XLSX.utils.book_append_sheet(wb,ws,name)};
    add(pr,'Projets'); add(mv,'Devis BDC factures');
    XLSX.writeFile(wb,`Suivi projets - ${today()}.xlsx`);
  }catch(e){toast(e.message,1)}
}

/* ================== DRAPEAUX : STOCK & PAVOISEMENTS ================== */
const DR_FORMATS=['200 x 300','100 x 150','140 x 220'];
const DR_GROUPES=['Europe','Monde','Partenaires'];
const PV_NEXT={'Prévu':'Posé','Posé':'Déposé'};
// Emplacements de pavoisement d'Eurexpo : nombre de mâts et format des drapeaux
const PV_SITES=[{nom:'Accueil Parvis',k:'parvis',mats:16,f:'200 x 300'},{nom:'Accueil Confluence',k:'confluence',mats:6,f:'100 x 150'}];
const pvSites=lieu=>{const s=String(lieu||'').toLowerCase();return PV_SITES.filter(x=>s.includes(x.k))};
function pvMats(lieu){const m={};pvSites(lieu).forEach(x=>m[x.f]=(m[x.f]||0)+x.mats);return m} // format → nb de mâts
function pvParF(l){const n={};l.forEach(x=>n[x.f]=(n[x.f]||0)+(+x.q));return n}
// « 12/16 mâts en 200 x 300 · 6/6 mâts en 100 x 150 »
function pvMatsTxt(lieu,l){const m=pvMats(lieu),n=pvParF(l);return Object.entries(m).map(([f,c])=>`${n[f]||0}/${c} mâts en ${f}`).join(' · ')}
// Plus de drapeaux que de mâts, ou un format sans mât à cet emplacement
function pvMatsPb(lieu,l){const m=pvMats(lieu);if(!Object.keys(m).length)return [];
  return Object.entries(pvParF(l)).filter(([f,q])=>q>(m[f]||0)).map(([f,q])=>m[f]?`${q} drapeaux en ${f} pour ${m[f]} mâts`:`${q} drapeau${q>1?'x':''} en ${f} alors qu'il n'y a pas de mât à ce format`)}
// Reprise du classeur « Inventaire drapeaux Oct 26 » : Nom;qté 200x300;état;qté 100x150;état;qté 140x220;état
const DR_OCT26={
  Europe:['Allemagne;3;2 neufs - 1 occasion;2;1 neuf - 1 occasion','Autriche;2;1 neuf - 1 occasion;2;1 neuf - 1 occasion','Belgique;3;2 neufs - 1 occasion;1;Occasion',
    'Bulgarie;1;Occasion;1;Occasion','Chypre;1;Neuf;1;Occasion','Danemark;3;2 neufs - 1 occasion;1;Occasion','Espagne;3;2 neufs - 1 occasion;1;Occasion','Estonie;1;Neuf;1;Occasion',
    'Europe;1;Neuf;9;2 neufs - 7 occasions;6;Occasions','Finlande;2;1 neuf - 1 occasion;4;1 neuf - 3 occasions','France;4;3 neufs - 1 occasion;3;2 neufs - 1 occasion','Grèce;3;2 neufs - 1 occasion;2;Neufs',
    'Hongrie;1;Occasion;1;Occasion','Irlande;2;1 neuf - 1 occasion;1;Occasion;3;Occasions','Italie;3;2 neufs - 1 occasion;1;Occasion','Lettonie;2;1 neuf - 1 occasion;1;Occasion;1;Occasion',
    'Lituanie;1;Neuf;1;Occasion;1;Occasion','Luxembourg;3;2 neufs - 1 occasion;2;Occasions','Malte;3;1 neuf - 2 occasions;1;Occasion;1;Occasion','Norvège;3;2 neufs - 1 occasion',
    'Pays-Bas;3;2 neufs - 1 occasion;1;Occasion','Pologne;3;2 neufs - 1 occasion;1;Occasion','Portugal;3;2 neufs - 1 occasion;1;Occasion','Roumanie;2;Neufs;1;Occasion;1;Occasion',
    'Slovaquie;1;Neuf;1;Occasion','Slovénie;2;Neufs;1;Occasion;1;Occasion','Tchéquie;2;Neufs;1;Occasion','Suède;3;2 neufs;2;Occasions'],
  Monde:['Algérie;1;Occasion','Argentine;1;Occasion','Australie;1;Occasion','Brésil;3;Occasions','Burkina Faso;1;Occasion','Canada;2;Occasions','Chine;1;Occasion','Corée du Sud;2;Occasions',
    "Côte d'Ivoire;2;Occasions",'Cuba;1;Occasion;1;Occasion','Hong Kong;1;Occasion','Inde;1;Occasion;1;Occasion','Japon;1;Occasion;1;Occasion','Libye;;;;;1;Occasion','Maroc;2;1 neuf - 1 occasion',
    'Pakistan;1;Occasion','Québec;1;Occasion;;;1;Occasion','Royaume-Uni;1;Occasion;2;1 neuf - 1 occasion','Russie;;;;;1;Usé ++','Sénégal;2;1 neuf - 1 occasion','Tunisie;1;Usé ++;1;Occasion',
    'Turquie;3;1 neuf - 2 occasions','Ukraine;1;Neuf','USA;3;Usé ++;2;Occasions','Vietnam;1;Occasion','Suisse;3;1 neuf - 2 occasions'],
  Partenaires:['GL events;6;5 neufs - 1 occasion;2;Neufs','Métropole de Lyon;5;4 neufs - 1 occasion;3;Neufs','Région AURA;4;2 neufs - 2 occasions;3;Neufs','GL Passion Sport;2;Occasions',
    'Only Lyon;3;2 neufs - 1 occasion;1;Occasion','Eurexpo;4;3 neufs - 1 occasion;2;Neufs']};
// « 2 neufs - 1 occasion », « Neufs », « Usé ++ »… → quantités par état (le reste non précisé passe en occasion)
function drAspect(q,a){q=+q||0;const s=String(a||'').toLowerCase();let n=0,o=0,u=0;
  const mn=s.match(/(\d+)\s*neu/),mo=s.match(/(\d+)\s*occ/),mu=s.match(/(\d+)\s*us/);
  if(mn||mo||mu){n=mn?+mn[1]:0;o=mo?+mo[1]:0;u=mu?+mu[1]:0}else if(/us/.test(s))u=q;else if(/neu/.test(s))n=q;else o=q;
  if(q-n-o-u>0)o+=q-n-o-u; return {neufs:String(n),occasions:String(o),uses:String(u)}}
function drOct26Items(){const L=[];
  Object.entries(DR_OCT26).forEach(([groupe,lines])=>lines.forEach(line=>{const c=line.split(';');
    DR_FORMATS.forEach((f,i)=>{const q=+c[1+i*2]||0;if(q>0)L.push({nom:c[0],groupe,format:f,...drAspect(q,c[2+i*2])})})}));return L}

const drKey=(n,f)=>n+'|'+f;
const drTot=r=>(+r.neufs||0)+(+r.occasions||0)+(+r.uses||0);
const drFormats=()=>[...new Set([...DR_FORMATS,...D.Drapeaux.map(r=>r.format).filter(Boolean)])];
const drGroupes=()=>[...new Set([...DR_GROUPES,...D.Drapeaux.map(r=>r.groupe).filter(Boolean)])];
const drOrd=()=>{const g=drGroupes();return (a,b)=>g.indexOf(a.groupe||'')-g.indexOf(b.groupe||'')||(+a.ordre||9999)-(+b.ordre||9999)||a.nom.localeCompare(b.nom,'fr')};
const drNoms=()=>{const m=new Map();D.Drapeaux.slice().sort(drOrd()).forEach(r=>{if(!m.has(r.nom))m.set(r.nom,r.groupe||'')});return m}; // nom → groupe, dans l'ordre
const drStock=()=>{const m={};D.Drapeaux.forEach(r=>{const k=drKey(r.nom,r.format);m[k]=(m[k]||0)+drTot(r)});return m};
function pvListe(p){try{const l=JSON.parse(p.liste||'[]');return Array.isArray(l)?l.filter(x=>x&&x.d&&x.f&&+x.q>0):[]}catch(e){return []}}
const pvNb=p=>pvListe(p).reduce((a,x)=>a+(+x.q),0);
// Le pavoisement immobilise-t-il ses drapeaux le jour d ? (un pavoisement « Posé » non déposé les garde jusqu'à aujourd'hui)
function pvHolds(p,d){if(p.statut==='Annulé'||!p.dateDebut||d<p.dateDebut)return false;const fin=p.dateFin||p.dateDebut,t=today();
  if(p.statut==='Déposé')return d<t&&d<=fin; return d<=fin||(p.statut==='Posé'&&d<=t)}
function drSortis(d,except){const m={};D.Pavoisements.forEach(p=>{if(p.id===except||!pvHolds(p,d))return;pvListe(p).forEach(x=>{const k=drKey(x.d,x.f);m[k]=(m[k]||0)+(+x.q)})});return m}
// Période réellement à vérifier pour un pavoisement (on ne regarde pas le passé)
function pvPeriode(p){const t=today(),d0=p.dateDebut>t?p.dateDebut:t;let d1=p.dateFin||p.dateDebut;if(p.statut==='Posé'&&d1<t)d1=t;return d0<=d1?[d0,d1]:null}
// Disponible sur toute une période (minimum jour par jour), hors pavoisement « except »
function drDispoPeriode(d0,d1,except){const S=drStock(),m={};let d=d0,n=0;
  for(;d<=d1&&n<370;d=addDays(d,1),n++){const s=drSortis(d,except);Object.keys(S).concat(Object.keys(s)).forEach(k=>{const v=(S[k]||0)-(s[k]||0);if(!(k in m)||v<m[k])m[k]=v})}
  return m}
function pvManques(p){if(p.statut==='Annulé'||p.statut==='Déposé')return [];const per=pvPeriode(p);if(!per)return [];
  const dis=drDispoPeriode(per[0],per[1],p.id);
  return pvListe(p).map(x=>({...x,dispo:Math.max(0,dis[drKey(x.d,x.f)]||0)})).filter(x=>+x.q>x.dispo)}
const pvManqueTxt=M=>M.map(x=>`${x.d} ${x.f} (${x.q} demandé${x.q>1?'s':''}, ${x.dispo} dispo)`).join(', ');
const pvAVenir=()=>D.Pavoisements.filter(p=>p.statut!=='Annulé'&&p.statut!=='Déposé'&&((p.dateFin||p.dateDebut)>=today()||p.statut==='Posé'));

function vDrapeaux(el){
  const st=UI.dr||(UI.dr={sub:'Stock',q:'',d:today(),g:'',pm:'avenir',pq:''});
  const nM=pvAVenir().filter(p=>pvManques(p).length).length;

    ${old?`<div class="mine" style="background:#fde4e5">⚠️ Le script du Google Sheet n'est pas encore à jour : colle le nouveau Code.gs puis <b>Déployer › Gérer les déploiements › ✏️ › Nouvelle version</b>. En attendant, rien ne peut être enregistré ici.</div>`:''}
    <div class="seg-ctl bsub">${[['Stock','🚩 Stock'],['Pav','📍 Pavoisements']].map(([k,l])=>`<button class="${st.sub===k?'on':''}" onclick="UI.dr.sub='${k}';render()">${l}${k==='Pav'&&nM?` <span class="badge">${nM}</span>`:''}</button>`).join('')}</div>
    <div id="drview"></div>`;

function drVue(el){
  const st=UI.dr, d=st.d||today();
  if(!D.Drapeaux.length){
    const n=drOct26Items().reduce((a,x)=>a+drTot(x),0);
    el.innerHTML=`<p class="empty">Aucun drapeau dans l'inventaire pour l'instant.</p>
      <div class="bar"><button class="btn pri" id="drimp" onclick="drImport()">⬇️ Reprendre l'inventaire d'octobre 2026 (${n} drapeaux)</button><button class="btn" onclick="drNew()">+ Drapeau</button></div>
      <p class="hint">Reprise du classeur « Inventaire drapeaux Oct 26 » : Europe, Monde et partenaires (GL events, Métropole, Région, Only Lyon, Eurexpo), en 200 x 300, 100 x 150 et 140 x 220, avec le détail neufs / occasions / usés.</p>`;
    return;
  }
  const S=drStock(), so=drSortis(d), F=drFormats(), q=(st.q||'').toLowerCase();
  const rows={};D.Drapeaux.forEach(r=>{(rows[r.nom]=rows[r.nom]||{})[r.format]=r});
  const noms=[...drNoms()].filter(([n,g])=>(!st.g||g===st.g)&&(!q||(n+' '+g).toLowerCase().includes(q)));
  const tot=Object.values(S).reduce((a,v)=>a+v,0), sortis=Object.values(so).reduce((a,v)=>a+v,0);
  const enPlace=D.Pavoisements.filter(p=>pvHolds(p,d));
  const ruptures=Object.keys(S).filter(k=>S[k]-(so[k]||0)<0).length;

    return head+`<tr><td><b>${esc(n)}</b></td>${F.map(f=>{const r=rows[n]&&rows[n][f];if(!r)return `<td class="dc none" data-n="${esc(n)}" data-f="${esc(f)}" data-g="${esc(g)}" onclick="drCell(this)">·</td>`;
      const k=drKey(n,f),t=S[k]||0,s=so[k]||0,dis=t-s;
      const det=[+r.neufs&&r.neufs+' N',+r.occasions&&r.occasions+' O',+r.uses&&r.uses+' U'].filter(Boolean).join(' · ');
      return `<td class="dc ${dis<0?'ko':dis===0?'zero':''} ${s?'out':''}" data-n="${esc(n)}" data-f="${esc(f)}" onclick="drCell(this)" title="${esc(n+' '+f+' : '+t+' en stock'+(s?', '+s+' sorti'+(s>1?'s':''):'')+(r.note?' · '+r.note:''))}">
        <b>${dis}</b><span class="dt">/${t}</span><small>${det||'—'}${s?` · ${s} sorti${s>1?'s':''}`:''}</small></td>`}).join('')}</tr>`}).join('');
  el.innerHTML=`<div class="kpis kc"><div class="kpi"><span>En stock</span><b>${tot}</b><small>${D.Drapeaux.length} références</small></div>
      <div class="kpi"><span>Sortis ${d===today()?"aujourd'hui":'le '+fD(d,{day:'numeric',month:'short'})}</span><b>${sortis}</b><small>${enPlace.length} pavoisement${enPlace.length>1?'s':''}</small></div>
      <div class="kpi"><span>Disponibles</span><b>${tot-sortis}</b></div>
      <div class="kpi ${ruptures?'neg':''}"><span>En manque</span><b>${ruptures}</b><small>références</small></div></div>
    <div class="bar chf"><label class="chk">Disponibilité au <input type="date" class="sel" value="${d}" onchange="UI.dr.d=this.value||today();render()"></label>
      ${d!==today()?`<button class="btn sm" onclick="UI.dr.d=today();render()">Aujourd'hui</button>`:''}
      <input class="search" type="search" placeholder="Rechercher un drapeau" value="${esc(st.q)}" oninput="UI.dr.q=this.value;pgRefresh()">
      <select class="sel" onchange="UI.dr.g=this.value;render()"><option value="">Tous les groupes</option>${drGroupes().map(g=>`<option ${g===st.g?'selected':''}>${esc(g)}</option>`).join('')}</select>

// Remises de clefs aux salons / sociétés : une ligne par clef (ClefsPrets), regroupées par remise (lot). Inventaire du tableau à clefs (Clefs).
const CL_FACT_J=8; // facturation des clefs non rendues : à partir de fin de démontage + 8 jours (comme dans le classeur)
const clDehors=p=>p.statut?0:Math.max(0,(+p.qte||0)-(+p.rendu||0));
const clOuvert=p=>clDehors(p)>0;
const clFactLe=p=>/^\d{4}-\d{2}-\d{2}$/.test(p.finDemontage||'')?addDays(p.finDemontage,CL_FACT_J):'';
const clRetard=p=>clOuvert(p)&&clFactLe(p)&&today()>=clFactLe(p);
const clDes=c=>[c.espace,c.acces].filter(Boolean).join(' - ');
const clNomP=p=>[p.prenom,p.nom].filter(Boolean).join(' ');
const clNumIdx=()=>{const m={};D.Clefs.forEach(c=>{const k=String(c.numero||'').trim().toUpperCase();if(k)(m[k]=m[k]||[]).push(c)});return m};
// clef de l'inventaire liée à une remise (par son identifiant, sinon par un n° qui n'existe qu'une fois)
function clClefOf(p,idx){if(p.clefId){const c=D.Clefs.find(x=>x.id===p.clefId);if(c)return c}
  const L=(idx||clNumIdx())[String(p.numero||'').trim().toUpperCase()];return L&&L.length===1?L[0]:null}
function clEnPret(){const m={},idx=clNumIdx();D.ClefsPrets.forEach(p=>{const n=clDehors(p);if(!n)return;const c=clClefOf(p,idx);if(c)m[c.id]=(m[c.id]||0)+n});return m}
function clLots(L){const m=new Map();L.forEach(p=>{const k=p.lot||p.id;if(!m.has(k))m.set(k,[]);m.get(k).push(p)});
  return [...m].map(([lot,l])=>{l.sort((a,b)=>String(a.designation).localeCompare(String(b.designation),'fr'));const h=l[0];
    return {lot,l,h,dehors:l.reduce((a,p)=>a+clDehors(p),0),retard:l.some(clRetard),fact:l.map(clFactLe).filter(Boolean).sort()[0]||'',
      date:l.map(p=>p.datePrepa).filter(Boolean).sort()[0]||''}})}
const clLotsRetard=()=>clLots(D.ClefsPrets.filter(clOuvert)).filter(g=>g.retard);
const clOpts=L=>[...new Set(L.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));
const clSocietes=()=>[...new Set(D.ClefsPrets.map(p=>p.societe).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));

  try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const data=clLireClasseur(wb);
    const dehors=data.prets.reduce((a,p)=>a+(p.statut?0:Math.max(0,+p.qte-(+p.rendu))),0);
    modal(`<h2>Reprise des clefs</h2><p>Fichier <b>${esc(f.name)}</b> :</p>
      <ul><li><b>${data.clefs.length}</b> clefs dans l'inventaire</li><li><b>${data.prets.length}</b> remises, dont <b>${dehors}</b> clefs encore dehors</li></ul>
      <p class="hint">La reprise ne se fait qu'une fois. Ensuite, tout se saisit dans l'appli.</p><div class="err" id="ferr"></div>
      <div class="acts"><span class="sp"></span><button class="btn" onclick="closeModal()">Annuler</button><button class="btn pri" id="clgo">Reprendre</button></div>`);
    $('#clgo').onclick=async()=>{const done=setBusy($('#clgo'),'Reprise en cours…');
      try{const res=await api('importClefs',{data});closeModal(true);toast(res.clefs+' clefs et '+res.prets+' remises reprises ✓');if(!FBM)await loadAll(true)}
      catch(e){done();$('#ferr').textContent=e.message}};
  }catch(e){toast(e.message,1)}
}
// Classeur « CLEFS - Inventaire & suivi » : onglets Références (inventaire) et Suivi des remises (lignes à partir de la 7e)
function clLireClasseur(wb){
  const sh=n=>{const k=wb.SheetNames.find(x=>x.trim().toLowerCase()===n.toLowerCase());if(!k)throw new Error('Onglet « '+n+' » introuvable dans le fichier');return XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:null})};
  const norm=v=>String(v??'').replace(/\s+/g,' ').trim(), K=v=>norm(v).toUpperCase();
  const num=v=>v==null?'':typeof v==='number'?String(Math.round(v*1000)/1000):norm(v);
  const dt=v=>v instanceof Date&&v.getFullYear()>=2000?ymd(new Date(v.getTime()+12*3600e3)):'';
  const q=v=>String(Math.max(0,parseInt(v,10)||0));
  const nid=()=>Math.random().toString(16).slice(2,12);
  const clefs=sh('Références').slice(1).filter(r=>r[0]!=null||r[1]!=null||r[2]!=null).map(r=>({id:'k'+nid(),espace:norm(r[0]),acces:norm(r[1]),numero:num(r[2]),
    stock:q(r[9]),reserve:q(r[12]),commentaire:[norm(r[14]),norm(r[15])].filter(Boolean).join(' · ')})).filter(c=>c.numero||c.acces);
  const byDN={},byN={},byD={};clefs.forEach(c=>{const d=K(clDes(c)),n=K(c.numero);(byDN[d+'|'+n]=byDN[d+'|'+n]||[]).push(c);(byN[n]=byN[n]||[]).push(c);(byD[d]=byD[d]||[]).push(c)});
  const lots={};
  const prets=sh('Suivi des remises').slice(6).filter(r=>r[2]||r[7]||r[8]).map(r=>{
    const numero=num(r[7]),des=norm(r[8]),nom=K(r[4]),prepa=dt(r[10]);
    const m=byDN[K(des)+'|'+K(numero)]||((byN[K(numero)]||[]).length===1?byN[K(numero)]:null)||(!numero&&(byD[K(des)]||[]).length===1?byD[K(des)]:null);
    let sortie=parseInt(r[5],10)||0;const rendu=parseInt(r[6],10)||0;if(rendu>sortie)sortie=rendu;
    const com=norm(r[17]);let statut='';if(sortie>rendu&&/perdu/i.test(com))statut=/factur/i.test(com)?'Facturée':'Perdue';
    const lk=K(r[2])+'|'+nom+'|'+prepa;lots[lk]=lots[lk]||'l'+nid();
    const remisPar=typeof r[9]==='number'?'':norm(r[9]),remisA=K(r[11])!==nom?norm(r[11]):'';
    return {id:'p'+nid(),lot:lots[lk],societe:norm(r[2]),prenom:norm(r[3]).toLowerCase().replace(/(^|[\s-])\S/g,x=>x.toUpperCase()),nom,clefId:m?m[0].id:'',
      numero,designation:des,qte:String(sortie),rendu:String(rendu),statut,remisPar,remisA,datePrepa:prepa,retireLe:dt(r[12])!==prepa?dt(r[12]):'',renduLe:dt(r[13]),
      recuperePar:norm(r[14])!==norm(r[9])?norm(r[14]):'',renduPar:K(r[15])!==(K(r[11])||nom)?norm(r[15]):'',finDemontage:K(r[16])==='RAS'?'RAS':dt(r[16]),commentaire:com}});
  if(!clefs.length&&!prets.length)throw new Error('Rien à reprendre dans ce fichier');
  return {clefs,prets};
}

function clVuePret(el){

  const open=D.ClefsPrets.filter(clOuvert);
  let G=clLots(open);
  const tot=open.reduce((a,p)=>a+clDehors(p),0), nRet=G.filter(g=>g.retard).length;
  const m0=t.slice(0,7), rendM=D.ClefsPrets.filter(p=>(p.renduLe||'').slice(0,7)===m0).reduce((a,p)=>a+(+p.rendu||0),0);
  const Gall=G, socs=clOpts(Gall.map(g=>g.h.societe)), pars=clOpts(Gall.map(g=>g.h.remisPar));
  if(q)G=G.filter(g=>[g.h.societe,clNomP(g.h),g.h.contact,g.h.remisPar,...g.l.map(p=>p.numero+' '+p.designation)].join(' ').toLowerCase().includes(q));
  if(st.fs)G=G.filter(g=>g.h.societe===st.fs);
  if(st.fp)G=G.filter(g=>g.h.remisPar===st.fp);
  const fin=g=>g.h.finDemontage||'';
  if(st.fe)G=G.filter(g=>({fact:g.retard,bientot:!g.retard&&g.fact,sans:!fin(g),ras:fin(g)==='RAS'})[st.fe]);
  const T={fact:(a,b)=>(b.retard-a.retard)||(a.fact||'9').localeCompare(b.fact||'9')||b.date.localeCompare(a.date),
    recent:(a,b)=>b.date.localeCompare(a.date)||String(a.h.societe).localeCompare(String(b.h.societe),'fr'),
    ancien:(a,b)=>(a.date||'9').localeCompare(b.date||'9')||String(a.h.societe).localeCompare(String(b.h.societe),'fr'),
    fin:(a,b)=>(/^\d/.test(fin(a))?fin(a):'9').localeCompare(/^\d/.test(fin(b))?fin(b):'9')||b.date.localeCompare(a.date),
