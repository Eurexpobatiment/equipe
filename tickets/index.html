<title>Ticketing · Eurexpo</title>
<style>
/* Ticketing – Eurexpo · même charte que l'appli Équipe (gl-lyonevents.com) */
:root{--navy:#004B46;--navy2:#00393A;--accent:#D62839;--bg:#F0F2F2;--card:#fff;--line:#DDE2E2;--muted:#4B5563;--txt:#1C1C1C;
--ok:#1F8A6E;--blue:#00697E;--mint:#3FB498;--grey:#9AA5A5;--warn:#B7791F}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Clash Grotesk","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15.5px;line-height:1.4;-webkit-text-size-adjust:100%;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));position:sticky;top:0;z-index:20}
header img{height:34px;max-width:40vw;object-fit:contain}
header h1{font-size:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
body.embed header{display:none}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar h2{margin:0;flex:1;display:flex;align-items:center;gap:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:19px;min-width:0}
.bar h2::before{content:'';flex:none;width:28px;height:10px;background:var(--mint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:2px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--txt);min-height:44px}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff;font-weight:600}
.btn.wa:hover{background:#178a45}
.btn.dan{color:var(--accent);border-color:#f0c2c7}
.btn.big{width:100%;padding:14px;font-size:17px;font-weight:600}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:10px}
.hint{color:var(--muted);font-size:13.5px}
.err{background:#fdecee;color:#8a1c27;border:1px solid #f0c2c7;padding:10px 12px;border-radius:2px;margin-bottom:10px}
.info{background:#e8f5f1;color:#0b4f3f;border:1px solid #bfe3d8;padding:10px 12px;border-radius:2px;margin-bottom:10px}
label{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#3b4444;margin:14px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid #c9d0d0;border-radius:2px;padding:11px 12px;background:#fff;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:9px 13px;cursor:pointer;min-height:42px}
.seg button.on{background:var(--navy);color:#fff}
.seg.prio button.on[data-v=Urgente]{background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto;flex:1;min-width:150px;padding:9px 10px;font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:2px;flex:1;min-width:96px}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.al b{color:var(--accent)}
.tk{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:2px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.tk:hover{background:#fafbfb}
.tk.s-Nouveau{border-left-color:var(--accent)}.tk.s-Envoye{border-left-color:var(--warn)}.tk.s-Pris{border-left-color:var(--blue)}.tk.s-Termine{border-left-color:var(--ok)}
.tk .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tk .l2{font-weight:600;margin:3px 0 2px;font-size:16px}
.tk .l3{color:#2d353b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:2px 8px;border-radius:2px;font-size:12.5px;font-weight:600;background:#eef1f1;color:#2d353b;white-space:nowrap}
.pill.Nouveau{background:#fdecee;color:#8a1c27}.pill.Envoye{background:#fdf3dc;color:#7a5200}.pill.Pris{background:#dff0f4;color:#00525f}.pill.Termine{background:#e1f3ec;color:#0b5f47}.pill.Annule{background:#eceeee;color:#555}
.pill.urg{background:var(--accent);color:#fff}
.late{color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}

.desc{white-space:pre-wrap;font-size:17px;margin:8px 0 0}
.tl{list-style:none;margin:0;padding:0}

.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li::before{content:'';position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--mint)}

.photos{display:flex;gap:8px;flex-wrap:wrap}

.acts{display:flex;flex-direction:column;gap:8px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#3b4444;margin:0 0 10px}
/* Plan (déplacement, zoom, pastille) */
.pz{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;height:230px;cursor:grab}

.pzin{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pzin img{display:block;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;width:34px;height:44px;transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin svg{display:block;width:100%;height:100%}
.pzb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.pzb button{width:42px;height:42px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer;border-radius:2px}
.pztag{position:absolute;left:8px;bottom:8px;background:rgba(0,75,70,.92);color:#fff;font-size:12.5px;padding:4px 8px;border-radius:2px;pointer-events:none}
.ov{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column}
.ov .ovh{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}

.ov .pz{flex:1;height:auto;border:0}
.ov .ovf{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.ov .ovf .btn{flex:1}
.dlg{position:fixed;inset:0;background:rgba(0,40,38,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.dlg>div{background:#fff;width:100%;max-width:560px;padding:16px;max-height:92vh;overflow:auto;border-radius:2px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
@media(min-width:620px){.dlg{align-items:center}}
.cfgrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.cfgent{border:1px solid var(--line,#d9dfdc);border-radius:8px;padding:10px 10px 4px;margin-bottom:10px}
.cfgtel{margin-left:14px}
.cfgent>.btn{margin:0 0 8px 14px}
.cfglien{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding:8px 0 6px;margin-top:2px}
.cfglien .hint{flex:1;min-width:150px}
.contacts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.contact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact .qui{flex:1;min-width:140px;font-weight:600}
.contact .qui small{display:block;font-weight:400;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:2px;z-index:80;max-width:90vw}
.center{text-align:center}
@media(max-width:560px){header img{height:26px;max-width:36vw}header h1 small{display:none}.bar h2{font-size:17px;white-space:nowrap}.bar h2::before{width:18px}.stat{min-width:40%}}
</style>

<body>

<script type="module">
/* Ticketing – Eurexpo

 * - Entreprises : ouverture du ticket par le lien du message WhatsApp (?t=clé), sans compte : « Pris en charge », « Terminé ».
 * - Entreprises : page « Mes interventions » (?e=clé de l'entreprise), sans compte : tous les tickets de l'entreprise, et eux seuls.
 *   La clé de l'entreprise est dans la liste « Entreprises » (TicketsCfg/config, lue par les équipes Eurexpo seulement) ;
 *   la fiche TicketsEnt/{clé de l'entreprise} garde la liste des clés de ses tickets (tenue à jour à chaque création / modification).

 */
const CONFIG = {
  firebase: {
    apiKey: 'AIzaSyARtP0RMkulG6c53-bnazwpGTspl0LgAhk', // clé publique (faite pour être dans la page)
    authDomain: 'equipe-batiment.firebaseapp.com',
    projectId: 'equipe-batiment',
    storageBucket: 'equipe-batiment.firebasestorage.app',
    messagingSenderId: '408022301135',

  },
  appCheckSite: '6Le3lBguAAAAAGb774RgCJp5Gd_jfG38Tks9out3',
  domaine: /@gl-events\.com$/,
  halls: ['Hall 1','Hall 2.1 AB','Hall 2.1 Ext','Hall 2.2','Hall 2.3','Hall 3.1','Hall 3.2','Hall 4.1','Hall 4.2','Hall 4.3','Hall 5.1','Hall 5.2','Hall 6.1','Hall 6.2','Hall 6.3','Hall 7',
          'Galerie 2','Galerie 4','Galerie 6','Place des Lumières','Accueil','Parvis','Parkings','Voiries / extérieurs','Bureaux / administratif','Toitures','Locaux techniques','Sous-sol / galeries techniques'],
  services: ['Bâtiment','Exploitation','Sécurité / sûreté','Commercial','Logistique','Restauration','Informatique','Autre'],
  attenteMin: 30, attenteUrgentMin: 10, // au-delà, un ticket non pris en charge est signalé en rouge
  planRatio: 3113 / 4400
};
const OUVERTS = ['Nouveau', 'Envoyé', 'Pris en charge'];
const CLS = { 'Nouveau': 'Nouveau', 'Envoyé': 'Envoye', 'Pris en charge': 'Pris', 'Terminé': 'Termine', 'Annulé': 'Annule' };

/* ---------- Petits outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + ' min'; const h = Math.floor(m / 60); if (h < 48) return h + ' h ' + String(m % 60).padStart(2, '0'); return Math.floor(h / 24) + ' j'; };

const Q = new URLSearchParams(location.search);
const EMBED = Q.has('embed') || window.top !== window.self; // affiché dans l'appli Équipe : sans en-tête
if (EMBED) document.body.classList.add('embed');
const CLE = /^[0-9a-f]{32}$/;
if (Q.get('t') && !CLE.test(Q.get('t'))) Q.delete('t'); // paramètre étranger (rechargement depuis l'appli Équipe)
if (Q.get('e') && !CLE.test(Q.get('e'))) Q.delete('e');
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');
const lien = cle => BASE + '?t=' + cle;
const lienEnt = cle => BASE + '?e=' + cle; // page « Mes interventions » d'une entreprise
const norm = s => String(s || '').trim().toLowerCase();

/* ---------- Firebase ---------- */
const V = '10.14.1';
let A, F, S, auth, db, st, acOk = false;
async function fbInit() {
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  [A, F, S] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-storage.js`)]);
  const app = initializeApp(CONFIG.firebase);
  // App Check : prouve à Firebase que les requêtes viennent bien de nos pages (obligatoire pour les photos)
  try {
    const AC = await Promise.race([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app-check.js`), new Promise(r => setTimeout(() => r(null), 5000))]);
    if (AC) { AC.initializeAppCheck(app, { provider: new AC.ReCaptchaEnterpriseProvider(CONFIG.appCheckSite), isTokenAutoRefreshEnabled: true }); acOk = true; }
  } catch (e) { console.warn('App Check :', e); }
  // Connexion partagée avec les autres applis eurexpobatiment.github.io (même rangement partout)
  try { auth = A.initializeAuth(app, { persistence: [A.browserLocalPersistence, A.indexedDBLocalPersistence] }); } catch (e) { auth = A.getAuth(app); }

const MSG = {
  'auth/invalid-email': 'Adresse e-mail invalide', 'auth/missing-email': 'Saisir l\'adresse e-mail', 'auth/missing-password': 'Saisir le mot de passe', 'auth/invalid-credential': 'E-mail ou mot de passe incorrect', 'auth/wrong-password': 'E-mail ou mot de passe incorrect',
  'auth/user-not-found': 'Aucun compte avec cette adresse : utiliser « Première connexion »', 'auth/email-already-in-use': 'Un compte existe déjà avec cette adresse : se connecter (ou « Mot de passe oublié »)',
  'auth/weak-password': 'Mot de passe trop court (6 caractères minimum)', 'auth/too-many-requests': 'Trop d\'essais : patienter quelques minutes', 'auth/network-request-failed': 'Pas de connexion internet',
  'permission-denied': 'Accès refusé pour cette action', 'unavailable': 'Serveur injoignable (pas de connexion ?)', 'storage/unauthorized': 'Envoi de la photo refusé', 'storage/retry-limit-exceeded': 'Envoi de la photo interrompu (connexion ?)'
};
const errMsg = e => MSG[e && e.code] || (e && e.message) || String(e);

/* ---------- État ---------- */
let me = null;          // {email, nom, service, membre} si connecté avec droit de créer ; sinon null
let authEtat = 'attente'; // attente | deconnecte | non-verifie | sans-acces | ok
let cfg = { entreprises: [], salons: [] };
let ouverts = [], histo = null, unsubOuverts = null, unsubTicket = null;
let ui = { vue: 'ouverts', salon: '', entreprise: '' };
// Page « Mes interventions » d'une entreprise (sans compte)
let ent = { cle: Q.get('e') || '', fiche: null, tk: {}, vue: 'ouverts', salon: '', nb: 80, err: '', charge: false, vuLe: 0 };
let unsubEnt = null;
const urlCache = {};

async function photoUrl(cle, fid) {
  const k = cle + '/' + fid;
  if (!urlCache[k]) urlCache[k] = S.getDownloadURL(S.ref(st, 'tickets/' + k)).catch(() => '');
  return urlCache[k];
}
// Réduit une photo de téléphone (≈ 4 Mo) à ≈ 300 Ko avant l'envoi
async function reduire(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bmp) return file;
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(b => ok(b || file), 'image/jpeg', 0.72));
}
async function envoyerPhotos(cle, blobs) {
  const ids = [];
  for (const b of blobs) { const fid = hex(8); await S.uploadBytes(S.ref(st, `tickets/${cle}/${fid}`), b, { contentType: 'image/jpeg' }); ids.push(fid); }
  return ids;
}

/* ---------- Plan : déplacement, zoom, pastille ---------- */
const PIN = '<svg viewBox="0 0 34 44"><path d="M17 43C17 43 32 26 32 16A15 15 0 0 0 2 16C2 26 17 43 17 43Z" fill="#D62839" stroke="#fff" stroke-width="2"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg>';
function plan(host, o = {}) {
  host.innerHTML = `<div class="pz${o.lock ? ' lock' : ''}"><div class="pzin"><img src="plan-s.webp" alt="Plan de masse d'Eurexpo" draggable="false"><div class="pin" hidden>${PIN}</div></div>
    ${o.lock ? (o.tag ? `<div class="pztag">${esc(o.tag)}</div>` : '') : '<div class="pzb"><button type="button" data-z="1.6" aria-label="Zoom avant">+</button><button type="button" data-z="0.625" aria-label="Zoom arrière">−</button><button type="button" data-z="0" aria-label="Vue d\'ensemble">⤢</button></div>'}</div>`;
  const vp = host.firstChild, inn = vp.firstChild, img = inn.firstChild, pin = inn.children[1], R = CONFIG.planRatio;
  let s = 1, x = 0, y = 0, W = 0, H = 0, hd = false, px = o.px, py = o.py, pret = false;
  const aPin = () => typeof px === 'number' && typeof py === 'number';
  const smin = () => Math.min(1, H / (W * R));
  function apply() {
    const cw = W * s, ch = W * R * s;
    x = cw <= W ? (W - cw) / 2 : Math.min(0, Math.max(W - cw, x));
    y = ch <= H ? (H - ch) / 2 : Math.min(0, Math.max(H - ch, y));
    inn.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    pin.style.transform = `translate(-50%,-100%) scale(${1 / s})`;
    if (s > 2 && !hd) { hd = true; const i = new Image(); i.onload = () => { img.src = i.src; }; i.src = 'plan.webp'; }
  }
  function placer() { pin.hidden = !aPin(); if (aPin()) { pin.style.left = px * 100 + '%'; pin.style.top = py * 100 + '%'; } }
  function centrer(z) { s = z; x = W / 2 - px * W * s; y = H / 2 - py * W * R * s; apply(); }
  function size() {
    const w = vp.clientWidth, h = vp.clientHeight; if (!w || !h) return;
    const premier = !pret; W = w; H = h; inn.style.width = W + 'px'; inn.style.height = W * R + 'px'; pret = true;
    if (premier) { if (aPin()) centrer(o.zoom || 5); else { s = smin(); apply(); } } else apply();
  }
  function zoomAt(cx, cy, f) { const ns = Math.min(16, Math.max(smin(), s * f)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); }
  placer(); new ResizeObserver(size).observe(vp); requestAnimationFrame(size);
  if (o.lock) return {};
  const pts = new Map(); let d0 = 0, bouge = 0, depart = null;
  const pos = e => { const r = vp.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  vp.addEventListener('pointerdown', e => { if (e.target.closest('.pzb')) return; vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, pos(e)); if (pts.size === 1) { bouge = 0; depart = pos(e); } else depart = null; d0 = 0; });

    else if (pts.size === 2) { const [p1, p2] = [...pts.values()], d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]); if (d0) zoomAt((p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2, d / d0); d0 = d; }
  });

    if (!pts.has(e.pointerId)) return; const p = pos(e); pts.delete(e.pointerId); d0 = 0;
    if (e.type === 'pointerup' && depart && bouge < 10 && o.edit && !pts.size) {
      const nx = (p[0] - x) / (W * s), ny = (p[1] - y) / (W * R * s);
      if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1) { px = +nx.toFixed(4); py = +ny.toFixed(4); placer(); apply(); o.onPick && o.onPick(px, py); }
    }
  };
  vp.addEventListener('pointerup', fin); vp.addEventListener('pointercancel', fin);
  vp.addEventListener('wheel', e => { e.preventDefault(); const p = pos(e); zoomAt(p[0], p[1], e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
  vp.querySelectorAll('.pzb button').forEach(b => b.onclick = () => { const f = +b.dataset.z; if (!f) { s = smin(); x = y = 0; apply(); } else zoomAt(W / 2, H / 2, f); });

}

/* ---------- Boîte de dialogue ---------- */

    d.innerHTML = `<div role="dialog" aria-modal="true"><h3>${esc(titre)}</h3><div class="de"></div>${html}<div class="acts2" style="margin-top:16px"><button class="btn" data-x style="flex:1">Annuler</button><button class="btn ${cls}" data-ok style="flex:2">${esc(okTxt)}</button></div></div>`;

/* ---------- Tickets d'une entreprise : fiche TicketsEnt/{clé de l'entreprise} ---------- */
const entDe = nom => { const n = norm(nom); return n ? cfg.entreprises.find(e => norm(e.nom) === n && e.cle) : null; };
const retourEnt = () => !!Q.get('e') || (!me && CLE.test(lsGet('tk.ent')));
// Ajoute le ticket à la liste de son entreprise (et le retire de l'ancienne si elle a changé). Sans effet si l'entreprise n'est pas dans la liste.
async function rattacher(cle, nom, ancien, encore = true) {
  const a = ancien == null ? null : entDe(ancien), n = entDe(nom);
  if ((a && a.cle) === (n && n.cle) && ancien != null) return;
  try {
    if (a) await F.updateDoc(F.doc(db, 'TicketsEnt', a.cle), { tickets: F.arrayRemove(cle), majLe: now() }).catch(() => {});
    if (n) await F.updateDoc(F.doc(db, 'TicketsEnt', n.cle), { tickets: F.arrayUnion(cle), majLe: now() });
  } catch (e) { // lien de l'entreprise régénéré entre-temps : relire la liste et recommencer une fois
    if (encore) { await chargerCfg(); return rattacher(cle, nom, null, false); }
    console.warn('Rattachement à l\'entreprise :', e);
  }
}
// Bâtiment : donne une clé aux entreprises qui n'en ont pas encore (liste créée avant la page « Mes interventions »)
async function clesManquantes() {
  if (!cfg.entreprises.length || cfg.entreprises.every(e => e.cle)) return;
  const avant = cfg.entreprises, P = avant.map(e => ({ ...e, cle: e.cle || hex(16) }));
  try { await enregistrerCfg(P, avant); } catch (e) { console.warn('Liens des entreprises :', e); }
}
// Enregistre la liste et tient à jour les fiches TicketsEnt (nouvelle entreprise, nom changé, lien régénéré, entreprise retirée)
async function enregistrerCfg(P, avant) {
  // Les fiches d'abord, la liste ensuite : une clé n'entre dans la liste que si sa fiche existe
  for (const e of P) {
    const prev = avant.find(x => x.cle && x.cle === e.cle), ref = F.doc(db, 'TicketsEnt', e.cle);
    let cles = [];
    if (!prev || norm(prev.nom) !== norm(e.nom)) { // retrouver les tickets déjà créés au nom de cette entreprise
      const s = await F.getDocs(F.query(F.collection(db, 'Tickets'), F.where('entreprise', '==', e.nom)));
      cles = s.docs.map(d => d.data()).sort((a, b) => String(a.creeLe).localeCompare(String(b.creeLe))).map(t => t.cle);
    }
    if (e._anc && e._anc !== e.cle) { // lien régénéré : reprendre la liste de l'ancienne fiche
      const o = await F.getDoc(F.doc(db, 'TicketsEnt', e._anc)).catch(() => null);
      if (o && o.exists()) cles = [...new Set([...(o.data().tickets || []), ...cles])];
    }
    const v = { nom: e.nom, metier: e.metier || '', majLe: now() };
    if (cles.length) v.tickets = F.arrayUnion(...cles); else if (!prev) v.tickets = [];
    await F.setDoc(ref, v, { merge: true });
  }
  await F.setDoc(F.doc(db, 'TicketsCfg', 'config'), { entreprises: JSON.stringify(P.map(({ _anc, ...e }) => e)), salons: JSON.stringify(cfg.salons || []), majPar: me.nom, majLe: now() });
  const gardees = new Set(P.map(e => e.cle));
  for (const x of avant) if (x.cle && !gardees.has(x.cle)) await F.deleteDoc(F.doc(db, 'TicketsEnt', x.cle)).catch(() => {});
  cfg.entreprises = P.map(({ _anc, ...e }) => e);
}

/* ---------- Page « Mes interventions » d'une entreprise (lien ?e=clé, sans compte) ---------- */
function vEntreprise() {
  const cle = Q.get('e');
  if (ent.cle !== cle || !unsubEnt) {
    if (unsubEnt) { unsubEnt(); unsubEnt = null; }
    ent = { ...ent, cle, fiche: null, tk: {}, err: '', nb: 80, salon: '' };
    unsubEnt = F.onSnapshot(F.doc(db, 'TicketsEnt', cle), s => {
      if (!s.exists()) { ent.fiche = null; ent.err = 'Ce lien n\'est plus valable. Demandez le nouveau lien au service Bâtiment d\'Eurexpo.'; if (lsGet('tk.ent') === cle) lsSet('tk.ent', ''); if (Q.get('e') === cle && !Q.get('t')) dessinerEnt(); return; }
      ent.fiche = s.data(); ent.err = ''; lsSet('tk.ent', cle); chargerEnt();
    }, e => { ent.err = errMsg(e); if (!Q.get('t')) dessinerEnt(); });
  }
  dessinerEnt();
  if (ent.fiche && Date.now() - ent.vuLe > 120000) chargerEnt(true);

// Lit les tickets de la liste (les plus récents d'abord). tout = relire aussi ceux déjà affichés.
async function chargerEnt(tout) {
  if (!ent.fiche || ent.charge) return;
  const cle = ent.cle, L = (ent.fiche.tickets || []).slice(-ent.nb).filter(k => CLE.test(k) && (tout || ent.tk[k] === undefined));
  if (L.length) {
    ent.charge = true; if ($('#mesint')) dessinerEnt();
    const R = await Promise.all(L.map(k => F.getDoc(F.doc(db, 'Tickets', k)).then(s => (s.exists() ? s.data() : null)).catch(() => undefined)));
    if (ent.cle !== cle) { ent.charge = false; return; }
    L.forEach((k, i) => { if (R[i] !== undefined) ent.tk[k] = R[i]; });
    ent.charge = false;
  }
  if (tout || !ent.vuLe) ent.vuLe = Date.now();
  if (Q.get('e') === cle && !Q.get('t') && !$('.dlg') && !$('.ov')) dessinerEnt();
}

      <div class="stat"><b>${O.filter(t => t.priorite === 'Urgente').length}</b><span>urgents</span></div><div class="stat"><b>${C.length}</b><span>terminés</span></div></div>
    <div class="filters"><div class="seg" id="evue">${[['ouverts', 'À traiter'], ['clos', 'Terminés']].map(([v, l]) => `<button data-v="${v}" class="${ent.vue === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${salons.length > 1 ? `<select id="efs" aria-label="Salon"><option value="">Tous les salons</option>${salons.map(v => `<option${v === ent.salon ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>` : ''}</div>
    ${L.length ? L.map(carte).join('') : attente ? '<p class="hint center">Chargement…</p>' : `<div class="card center hint">${ent.vue === 'ouverts' ? 'Aucune intervention en attente.' : 'Aucune intervention terminée.'}</div>`}
    ${cles.length > ent.nb ? '<button class="btn" id="plus" style="width:100%">Afficher les interventions plus anciennes</button>' : ''}
    <p class="hint center" style="margin-top:14px">Page réservée à ${esc(ent.fiche.nom || 'votre entreprise')} : gardez ce lien en favori, ne le transférez pas.<br>Eurexpo Lyon · service Bâtiment</p></div>`;

  const dessiner = () => {
    d.innerHTML = `<div role="dialog" aria-modal="true"><h3>Entreprises proposées à la saisie</h3><p class="hint">Le métier s'affiche en tête du message WhatsApp (ex. : ÉLECTRICITÉ – nom de l'entreprise). Les numéros ne sont visibles que des équipes Eurexpo, sur la fiche du ticket (appel ou WhatsApp direct).<br>Chaque entreprise a un lien « Mes interventions » : la page de tous ses tickets, sans compte. À lui envoyer directement (pas dans le groupe du salon) ; « Nouveau lien » coupe l'ancien.</p>
      ${L.map((e, i) => `<div class="cfgent"><div class="cfgrow"><input type="text" data-i="${i}" data-k="nom" value="${esc(e.nom)}" placeholder="Entreprise" aria-label="Entreprise"><input type="text" data-i="${i}" data-k="metier" value="${esc(e.metier || '')}" placeholder="Métier / lot" aria-label="Métier"><button class="btn sm dan" data-del="${i}" aria-label="Retirer l'entreprise">×</button></div>
        ${e.tels.map((c, j) => `<div class="cfgrow cfgtel"><input type="text" data-i="${i}" data-j="${j}" data-k="nom" value="${esc(c.nom || '')}" maxlength="60" placeholder="Nom du contact" aria-label="Nom du contact"><input type="tel" data-i="${i}" data-j="${j}" data-k="tel" value="${esc(c.tel || '')}" maxlength="24" placeholder="06 12 34 56 78" aria-label="Téléphone"><button class="btn sm dan" data-delt="${i},${j}" aria-label="Retirer le numéro">×</button></div>`).join('')}
        <button class="btn sm" data-addt="${i}">＋ Numéro</button>
        <div class="cfglien">${actives.has(e.cle) ? `<span class="hint">🔗 Mes interventions</span><button class="btn sm" data-cpl="${i}">Copier le lien</button><a class="btn sm" href="${esc(lienEnt(e.cle))}" target="_blank" rel="noopener">Ouvrir</a>${e.tels.filter(c => c.tel).map(c => `<a class="btn sm wa" href="https://wa.me/${esc(telChiffres(c.tel))}?text=${encodeURIComponent(msgLien(e))}" target="_blank" rel="noopener">Envoyer à ${esc(c.nom || telAffiche(c.tel))}</a>`).join('')}<button class="btn sm dan" data-regen="${i}">Nouveau lien</button>`
          : `<span class="hint">🔗 ${e._anc ? 'Nouveau lien « Mes interventions » actif après « Enregistrer » (l\'ancien ne fonctionnera plus).' : 'Lien « Mes interventions » disponible après « Enregistrer ».'}</span>${e._anc ? `<button class="btn sm" data-undo="${i}">Garder l'ancien</button>` : ''}`}</div></div>`).join('')}
      <button class="btn sm" data-add>＋ Ajouter une entreprise</button>
      <div class="acts2" style="margin-top:16px"><button class="btn" data-x style="flex:1">Fermer</button><button class="btn pri" data-ok style="flex:2">Enregistrer</button></div></div>`;
    d.querySelectorAll('input').forEach(i => i.oninput = () => { const e = L[+i.dataset.i]; (i.dataset.j != null ? e.tels[+i.dataset.j] : e)[i.dataset.k] = i.value; });
    d.querySelectorAll('[data-addt]').forEach(b => b.onclick = () => { const i = +b.dataset.addt; L[i].tels.push({ nom: '', tel: '' }); dessiner(); d.querySelector(`input[data-i="${i}"][data-j="${L[i].tels.length - 1}"][data-k=nom]`).focus(); });
    d.querySelectorAll('[data-delt]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.delt.split(',').map(Number); L[i].tels.splice(j, 1); dessiner(); });
    d.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { L.splice(+b.dataset.del, 1); dessiner(); });
    d.querySelectorAll('[data-cpl]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(lienEnt(L[+b.dataset.cpl].cle)); toast('Lien copié'); } catch (e) { toast('Copie impossible sur cet appareil'); } });
    d.querySelectorAll('[data-regen]').forEach(b => b.onclick = () => { const e = L[+b.dataset.regen]; e._anc = e.cle; e.cle = hex(16); dessiner(); });
    d.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { const e = L[+b.dataset.undo]; e.cle = e._anc; delete e._anc; dessiner(); });
    $('[data-add]', d).onclick = () => { L.push({ nom: '', metier: '', cle: hex(16), tels: [] }); dessiner(); const a = d.querySelectorAll('input[data-k=nom]:not([data-j])'); a[a.length - 1].focus(); };
    $('[data-x]', d).onclick = () => d.remove();
    $('[data-ok]', d).onclick = async () => {
      const P = L.map(e => ({ nom: e.nom.trim(), metier: (e.metier || '').trim(), cle: e.cle, _anc: e._anc, tels: e.tels.map(c => ({ nom: (c.nom || '').trim(), tel: (c.tel || '').trim() })).filter(c => c.tel) })).filter(e => e.nom).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
      const b = $('[data-ok]', d); b.disabled = true; b.textContent = 'Enregistrement…';
      try { await enregistrerCfg(P, avant); d.remove(); toast('Liste enregistrée'); if (P.some(e => !actives.has(e.cle))) vCfg(); /* rouvrir : les nouveaux liens sont prêts à copier */ } catch (e) { toast(errMsg(e)); b.disabled = false; b.textContent = 'Enregistrer'; }
    };
  };
  dessiner(); document.body.append(d);
}

/* ---------- Aiguillage ---------- */
function route() {
  if (unsubTicket) { unsubTicket(); unsubTicket = null; }
  const cle = Q.get('t');
  if (cle) return vTicket(cle);          // lien d'un ticket : lisible sans compte
  if (Q.get('e')) return vEntreprise();  // lien d'une entreprise : ses interventions, sans compte
  qui();
  if (authEtat === 'attente') return;
  if (authEtat === 'deconnecte') return vLogin();
  if (authEtat === 'non-verifie') return vNonVerifie();
  if (authEtat === 'sans-acces') { $('#app').innerHTML = `<div class="card center"><p>Le ticketing est réservé aux adresses @gl-events.com et à l'équipe Bâtiment.</p><button class="btn" id="o3">Changer de compte</button></div>`; $('#o3').onclick = () => A.signOut(auth); return; }
  vListe();
}
setInterval(() => { if ($('#liste') && !$('.dlg') && !$('.ov')) vListe(); }, 60000); // délais d'attente à jour

addEventListener('visibilitychange', () => { if (!document.hidden && $('#mesint') && Date.now() - ent.vuLe > 120000) chargerEnt(true); });

try { await fbInit(); ecouterConnexion(); if (Q.get('t') || Q.get('e')) route(); }
catch (e) { $('#app').innerHTML = `<div class="err">Impossible de démarrer (connexion internet ?). ${esc(errMsg(e))}</div>`; }
</script>
</body>
